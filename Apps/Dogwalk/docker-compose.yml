name: linuxserver-dogwalk
services:
  dogwalk:
    image: linuxserver/dogwalk:cb661a4d-ls51
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: dogwalk-by-roket
x-casaos:
  architectures:
  - amd64
  main: dogwalk
  description:
    en_US: DOGWALK is Blender Studio's long awaited second game project, focused on
      creating a bite-sized interactive storytelling playground. Play as a big adorable
      dog and explore the winter woods with a little kid.
  tagline:
    en_US: Blender Studio's long awaited second game project, focused on creating
      a bite-sized interactive storytelling playground. Play as a big adorable dog
      and explore the winter woods with a little kid.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/dogwalk-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/dogwalk-logo.png
  title:
    en_US: Dogwalk
  category: Others
  port_map: '3000'
  id: by-roket.linuxserver.dogwalk
  version: cb661a4d-ls51
  index: /
