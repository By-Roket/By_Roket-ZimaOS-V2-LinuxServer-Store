name: linuxserver-joplin
services:
  joplin:
    image: linuxserver/joplin:3.6.16
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: joplin-by-roket
x-casaos:
  architectures:
  - amd64
  main: joplin
  description:
    en_US: Joplin is a free, open source note taking and to-do application, which
      can handle a large number of notes organised into notebooks.
  tagline:
    en_US: A free, open source note taking and to-do application, which can handle
      a large number of notes organised into notebooks.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/joplin-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/joplin-logo.png
  title:
    en_US: Joplin (LinuxServer.io)
  category: Productivity
  id: by-roket.linuxserver.joplin
  port_map: '3000'
  version: 3.6.16
  index: /
