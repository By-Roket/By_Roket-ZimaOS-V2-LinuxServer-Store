name: linuxserver-lsio-api
services:
  lsio-api:
    image: linuxserver/lsio-api:version-9eda67ec
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: for UserID
      - container: PGID
        description:
          en_US: for GroupID
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: lsio-api-by-roket
x-casaos:
  architectures:
  - amd64
  main: lsio-api
  description:
    en_US: This container needs special attention. Please check https://hub.docker.com/r/linuxserver/lsio-api
      for details.
  tagline:
    en_US: This container needs special attention. Please check https://hub. Docker.
      Com/r/linuxserver/lsio-api for details.
  developer: LinuxServer.io
  author: WisdomSky
  icon: ''
  thumbnail: ''
  title:
    en_US: Lsio api
  category: Developer
  port_map: '80'
  id: by-roket.linuxserver.lsio-api
  version: version-9eda67ec
  index: /
