name: linuxserver-steam
services:
  steam:
    image: linuxserver/steam:version-e585948a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: steam-by-roket
x-casaos:
  architectures:
  - amd64
  main: steam
  description:
    en_US: Steam is the ultimate destination for playing, discussing, and creating
      games.
  tagline:
    en_US: The ultimate destination for playing, discussing, and creating games.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/steam-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/steam-logo.png
  title:
    en_US: Steam (LinuxServer.io)
  category: Others
  id: by-roket.linuxserver.steam
  port_map: '3000'
  version: version-e585948a
  index: /
