name: linuxserver-budge
services:
  budge:
    image: linuxserver/budge:0.0.9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 80
      published: 80
      protocol: tcp
    - target: 443
      published: 443
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: budge-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: budge
  description:
    en_US: Budge is an open source 'budgeting with envelopes' personal finance app.
  tagline:
    en_US: An open source 'budgeting with envelopes' personal finance app.
  developer: LinuxServer.io
  author: WisdomSky
  icon: ''
  thumbnail: ''
  title:
    en_US: Budge (LinuxServer.io)
  category: Finance
  id: by-roket.linuxserver.budge
  port_map: '80'
  version: 0.0.9
  index: /
