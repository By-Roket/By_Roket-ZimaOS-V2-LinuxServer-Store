name: linuxserver-sabnzbd
services:
  sabnzbd:
    image: linuxserver/sabnzbd:5.1.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 8080
      published: 8080
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    - type: bind
      source: /DATA/AppData/$AppID/incomplete-downloads
      target: /incomplete-downloads
    - type: bind
      source: /DATA/AppData/$AppID/downloads
      target: /downloads
    container_name: sabnzbd-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: sabnzbd
  description:
    en_US: Sabnzbd makes Usenet as simple and streamlined as possible by automating
      everything we can. All you have to do is add an .nzb. SABnzbd takes over from
      there, where it will be automatically downloaded, verified, repaired, extracted
      and filed away with zero human interaction.
  tagline:
    en_US: Makes Usenet as simple and streamlined as possible by automating everything
      we can. All you have to do is add an. Nzb. SABnzbd takes over from there, where
      it will be automatically downloaded, verified, repaired, extracted and filed
      away with zero human interaction.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/sabnzbd-banner.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/sabnzbd-banner.png
  title:
    en_US: Sabnzbd (LinuxServer.io)
  category: Others
  id: by-roket.linuxserver.sabnzbd
  port_map: '8080'
  version: 5.1.2
  index: /
