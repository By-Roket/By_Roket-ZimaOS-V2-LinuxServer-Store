name: linuxserver-pyload-ng
services:
  pyload-ng:
    image: linuxserver/pyload-ng:0.5.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 8000
      published: 8000
      protocol: tcp
    - target: 9666
      published: 9666
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    - type: bind
      source: /DATA/AppData/$AppID/downloads
      target: /downloads
    container_name: pyload-ng-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: pyload-ng
  description:
    en_US: pyLoad is a Free and Open Source download manager written in Python and
      designed to be extremely lightweight, easily extensible and fully manageable
      via web.
  tagline:
    en_US: A Free and Open Source download manager written in Python and designed
      to be extremely lightweight, easily extensible and fully manageable via web.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://github.com/linuxserver/docker-templates/raw/master/linuxserver.io/img/pyload-logo.png
  thumbnail: https://github.com/linuxserver/docker-templates/raw/master/linuxserver.io/img/pyload-logo.png
  title:
    en_US: Pyload ng (LinuxServer.io)
  category: Others
  id: by-roket.linuxserver.pyload-ng
  port_map: '8000'
  version: 0.5.0
  index: /
