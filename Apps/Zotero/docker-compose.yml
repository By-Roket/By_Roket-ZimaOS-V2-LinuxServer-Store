name: linuxserver-zotero
services:
  zotero:
    image: linuxserver/zotero:10.0.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: zotero-by-roket
x-casaos:
  architectures:
  - amd64
  main: zotero
  description:
    en_US: Zotero is a free, easy-to-use tool to help you collect, organize, annotate,
      cite, and share research.
  tagline:
    en_US: A free, easy-to-use tool to help you collect, organize, annotate, cite,
      and share research.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/zotero-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/zotero-icon.png
  title:
    en_US: Zotero
  category: Others
  port_map: '3000'
  id: by-roket.linuxserver.zotero
  version: 10.0.1
  index: /
