name: linuxserver-nzbget
services:
  nzbget:
    image: linuxserver/nzbget:26.3.20260827
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      NZBGET_USER: ''
      NZBGET_PASS: ''
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
      - container: NZBGET_USER
        description:
          en_US: Specify the user for web authentication. [OPTIONAL]
      - container: NZBGET_PASS
        description:
          en_US: Specify the password for web authentication. [OPTIONAL]
    ports:
    - target: 6789
      published: 6789
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    - type: bind
      source: /DATA/AppData/$AppID/downloads
      target: /downloads
    container_name: nzbget-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: nzbget
  description:
    en_US: Nzbget is a usenet downloader, written in C++ and designed with performance
      in mind to achieve maximum download speed by using very little system resources.
  tagline:
    en_US: A usenet downloader, written in C++ and designed with performance in mind
      to achieve maximum download speed by using very little system resources.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/nzbget-banner.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/nzbget-banner.png
  title:
    en_US: Nzbget (LinuxServer.io)
  category: Others
  id: by-roket.linuxserver.nzbget
  port_map: '6789'
  version: 26.3.20260827
  index: /
