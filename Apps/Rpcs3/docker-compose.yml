name: linuxserver-rpcs3
services:
  rpcs3:
    image: linuxserver/rpcs3:version-build-6567a5a2f8ab47a89db395d6b47a7b59b23d6960
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: rpcs3-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: rpcs3
  description:
    en_US: RPCS3 is a multi-platform open-source Sony PlayStation 3 emulator and debugger
      written in C++ for Windows, Linux, macOS and FreeBSD.
  tagline:
    en_US: A multi-platform open-source Sony PlayStation 3 emulator and debugger written
      in C++ for Windows, Linux, macOS and FreeBSD.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/rpcs3-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/rpcs3-logo.png
  title:
    en_US: Rpcs3
  category: Others
  port_map: '3000'
  id: by-roket.linuxserver.rpcs3
  version: version-build-6567a5a2f8ab47a89db395d6b47a7b59b23d6960
  index: /
