name: linuxserver-openshot
services:
  openshot:
    image: linuxserver/openshot:3.5.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: openshot-by-roket
x-casaos:
  architectures:
  - amd64
  main: openshot
  description:
    en_US: OpenShot Video Editor is an award-winning free and open-source video editor
      for Linux, Mac, and Windows, and is dedicated to delivering high quality video
      editing and animation solutions to the world.
  tagline:
    en_US: Video Editor is an award-winning free and open-source video editor for
      Linux, Mac, and Windows, and is dedicated to delivering high quality video editing
      and animation solutions to the world.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/openshot-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/openshot-logo.png
  title:
    en_US: Openshot (LinuxServer.io)
  category: Media
  id: by-roket.linuxserver.openshot
  port_map: '3000'
  version: 3.5.1
  index: /
