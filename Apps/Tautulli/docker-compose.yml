name: linuxserver-tautulli
services:
  tautulli:
    image: linuxserver/tautulli:2.18.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 8181
      published: 8181
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: tautulli-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: tautulli
  description:
    en_US: Tautulli is a python based web application for monitoring, analytics and
      notifications for Plex Media Server.
  tagline:
    en_US: A python based web application for monitoring, analytics and notifications
      for Plex Media Server.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/tautulli-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/tautulli-icon.png
  title:
    en_US: Tautulli (LinuxServer.io)
  category: Media
  id: by-roket.linuxserver.tautulli
  port_map: '8181'
  version: 2.18.1
  index: /
