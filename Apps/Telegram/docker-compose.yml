name: linuxserver-telegram
services:
  telegram:
    image: linuxserver/telegram:7.1.4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: telegram-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: telegram
  description:
    en_US: Telegram is a cloud-based mobile and desktop messaging app.
  tagline:
    en_US: A cloud-based mobile and desktop messaging app.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/telegram-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/telegram-logo.png
  title:
    en_US: Telegram (LinuxServer.io)
  category: Productivity
  id: by-roket.linuxserver.telegram
  port_map: '3000'
  version: 7.1.4
  index: /
