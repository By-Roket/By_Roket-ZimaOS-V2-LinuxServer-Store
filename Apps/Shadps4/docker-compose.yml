name: linuxserver-shadps4
services:
  shadps4:
    image: linuxserver/shadps4:shadPS4QtLauncher-2026-08-31-bcebdf7d53eaff384d62bfef169a4e98ce284390-ls39
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: shadps4-by-roket
x-casaos:
  architectures:
  - amd64
  main: shadps4
  description:
    en_US: shadPS4 is an early PlayStation 4 emulator for Windows, Linux and macOS
      written in C++.
  tagline:
    en_US: An early PlayStation 4 emulator for Windows, Linux and macOS written in
      C++.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/shadps4-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/shadps4-logo.png
  title:
    en_US: Shadps4 (LinuxServer.io)
  category: Others
  id: by-roket.linuxserver.shadps4
  port_map: '3000'
  version: shadPS4QtLauncher-2026-08-31-bcebdf7d53eaff384d62bfef169a4e98ce284390-ls39
  index: /
