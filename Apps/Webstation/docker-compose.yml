name: linuxserver-webstation
services:
  webstation:
    image: linuxserver/webstation:0.6.0-romm
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: webstation-by-roket
x-casaos:
  architectures:
  - amd64
  main: webstation
  description:
    en_US: Webstation is a web native emulation focused LXQt desktop based on Ubuntu.
  tagline:
    en_US: A web native emulation focused LXQt desktop based on Ubuntu.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/webstation-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/webstation-logo.png
  title:
    en_US: Webstation (LinuxServer.io)
  category: Others
  id: by-roket.linuxserver.webstation
  port_map: '3000'
  version: 0.6.0-romm
  index: /
