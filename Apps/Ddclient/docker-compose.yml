name: linuxserver-ddclient
services:
  ddclient:
    image: linuxserver/ddclient:4.0.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: ddclient-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: ddclient
  description:
    en_US: Ddclient is a Perl client used to update dynamic DNS entries for accounts
      on Dynamic DNS Network Service Provider. It was originally written by Paul Burry
      and is now mostly by wimpunk. It has the capability to update more than just
      dyndns and it can fetch your WAN-ipaddress in a few different ways.
  tagline:
    en_US: A Perl client used to update dynamic DNS entries for accounts on Dynamic
      DNS Network Service Provider. It was originally written by Paul Burry and is
      now mostly by wimpunk. It has the capability to update more than just dyndns
      and it can fetch your WAN-ipaddress in a few different ways.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/ddclient-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/ddclient-logo.png
  title:
    en_US: Ddclient
  category: Networking
  port_map: '80'
  id: by-roket.linuxserver.ddclient
  version: 4.0.0
  index: /
