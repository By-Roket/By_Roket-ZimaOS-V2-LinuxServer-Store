name: linuxserver-requestrr
services:
  requestrr:
    image: linuxserver/requestrr:2.1.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: for UserID
      - container: PGID
        description:
          en_US: for GroupID
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
      volumes:
      - container: /config
        description:
          en_US: Contains all relevant configuration files.
      ports:
      - container: '4545'
        description:
          en_US: web gui
    ports:
    - target: 4545
      published: 4545
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: requestrr-by-roket
x-casaos:
  architectures:
  - amd64
  - arm
  - arm64
  main: requestrr
  description:
    en_US: 'Visit homepage: https://github.com/orgs/linuxserver/packages/container/package/requestrr'
  tagline:
    en_US: A chatbot used to simplify using services like Sonarr/Radarr/Ombi via the
      use of chat.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/requestrr.png
  thumbnail: https://github.com/darkalfx/requestrr/raw/master/Logos/requestrr_discord_Icon_512.png
  title:
    en_US: Requestrr
  category: Media
  project_url: https://github.com/darkalfx/requestrr
  port_map: '4545'
  id: by-roket.linuxserver.requestrr
  version: 2.1.2
  index: /
