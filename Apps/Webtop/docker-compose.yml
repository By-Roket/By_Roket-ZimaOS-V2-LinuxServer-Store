name: linuxserver-webtop
services:
  webtop:
    image: linuxserver/webtop:arch-kde-version-2025-07-12
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: webtop-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: webtop
  description:
    en_US: Webtop - Alpine, Ubuntu, Fedora, and Arch based containers containing full
      desktop environments in officially supported flavors accessible via any modern
      web browser.
  tagline:
    en_US: Alpine, Ubuntu, Fedora, and Arch based containers containing full desktop
      environments in officially supported flavors accessible via any modern web browser.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/webtop-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/webtop-logo.png
  title:
    en_US: Webtop
  category: Others
  port_map: '3000'
  id: by-roket.linuxserver.webtop
  version: arch-kde-version-2025-07-12
  index: /
