name: linuxserver-ci-debug
services:
  ci-debug:
    image: linuxserver/ci-debug:933e2702-ls1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: ci-debug-by-roket
x-casaos:
  architectures:
  - amd64
  main: ci-debug
  description:
    en_US: This container needs special attention. Please check https://hub.docker.com/r/linuxserver/ci-debug
      for details.
  tagline:
    en_US: This container needs special attention. Please check https://hub. Docker.
      Com/r/linuxserver/ci-debug for details.
  developer: LinuxServer.io
  author: WisdomSky
  icon: ''
  thumbnail: ''
  title:
    en_US: Ci debug
  category: Developer
  port_map: '80'
  id: by-roket.linuxserver.ci-debug
  version: 933e2702-ls1
  index: /
