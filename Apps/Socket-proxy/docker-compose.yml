name: linuxserver-socket-proxy
services:
  socket-proxy:
    image: linuxserver/socket-proxy:3.4.3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/socket-proxy/config
      target: /config
x-casaos:
  architectures:
  - amd64
  - arm64
  main: socket-proxy
  description:
    en_US: This container needs special attention. Please check https://hub.docker.com/r/linuxserver/socket-proxy
      for details.
  tagline:
    en_US: This container needs special attention. Please check https://hub. Docker.
      Com/r/linuxserver/socket-proxy for details.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/docker-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/docker-logo.png
  title:
    en_US: Socket proxy
  category: Networking
  port_map: '80'
  id: by-roket.linuxserver.socket-proxy
  version: 3.4.3
  index: /
