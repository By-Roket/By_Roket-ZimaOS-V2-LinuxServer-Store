name: linuxserver-filezilla
services:
  filezilla:
    image: linuxserver/filezilla:3.69.6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: filezilla-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: filezilla
  description:
    en_US: FIleZilla Client is a fast and reliable cross-platform FTP, FTPS and SFTP
      client with lots of useful features and an intuitive graphical user interface.
  tagline:
    en_US: Client is a fast and reliable cross-platform FTP, FTPS and SFTP client
      with lots of useful features and an intuitive graphical user interface.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/filezilla-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/filezilla-logo.png
  title:
    en_US: Filezilla (LinuxServer.io)
  category: Others
  id: by-roket.linuxserver.filezilla
  port_map: '3000'
  version: 3.69.6
  index: /
