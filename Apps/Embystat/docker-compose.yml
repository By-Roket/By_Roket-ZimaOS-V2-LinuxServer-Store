name: linuxserver-embystat
services:
  embystat:
    image: linuxserver/embystat:0.2.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: for UserID
      - container: PGID
        description:
          en_US: for GroupID
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
      volumes:
      - container: /config
        description:
          en_US: Appdata
      ports:
      - container: '6555'
        description:
          en_US: Webui Port
    ports:
    - target: 6555
      published: 6555
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/embystat/config
      target: /config
x-casaos:
  architectures:
  - amd64
  - arm64
  main: embystat
  description:
    en_US: 'Visit homepage: https://hub.docker.com/r/linuxserver/embystat/'
  tagline:
    en_US: A personal web server that can calculate all kinds of statistics from your
      (local) Emby server. Just install this on your server and let him calculate
      all kinds of fun stuff.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/embystat-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/embystat-logo.png
  title:
    en_US: Embystat
  category: Media
  project_url: https://github.com/mregni/EmbyStat
  port_map: '6555'
  id: by-roket.linuxserver.embystat
  version: 0.2.0
  index: /
