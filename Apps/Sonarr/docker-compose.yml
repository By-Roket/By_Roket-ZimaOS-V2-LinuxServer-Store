name: linuxserver-sonarr
services:
  sonarr:
    image: linuxserver/sonarr:4.0.19
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 8989
      published: 8989
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    - type: bind
      source: /DATA/AppData/$AppID/tv
      target: /tv
    - type: bind
      source: /DATA/AppData/$AppID/downloads
      target: /downloads
    container_name: sonarr-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: sonarr
  description:
    en_US: Sonarr (formerly NZBdrone) is a PVR for usenet and bittorrent users. It
      can monitor multiple RSS feeds for new episodes of your favorite shows and will
      grab, sort and rename them. It can also be configured to automatically upgrade
      the quality of files already downloaded when a better quality format becomes
      available.
  tagline:
    en_US: (formerly NZBdrone) is a PVR for usenet and bittorrent users. It can monitor
      multiple RSS feeds for new episodes of your favorite shows and will grab, sort
      and rename them. It can also be configured to automatically upgrade the quality
      of files already downloaded when a better quality format becomes available.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/sonarr-banner.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/sonarr-banner.png
  title:
    en_US: Sonarr
  category: Media
  port_map: '8989'
  id: by-roket.linuxserver.sonarr
  version: 4.0.19
  index: /
