name: linuxserver-mstream
services:
  mstream:
    image: linuxserver/mstream:6.24.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    - type: bind
      source: /DATA/AppData/$AppID/music
      target: /music
    container_name: mstream-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: mstream
  description:
    en_US: Mstream is a personal music streaming server. You can use mStream to stream
      your music from your home computer to any device, anywhere. There are mobile
      apps available for both Android and iPhone.
  tagline:
    en_US: A personal music streaming server. You can use mStream to stream your music
      from your home computer to any device, anywhere. There are mobile apps available
      for both Android and iPhone.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mstream-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mstream-icon.png
  title:
    en_US: Mstream
  category: Media
  port_map: '3000'
  id: by-roket.linuxserver.mstream
  version: 6.24.0
  index: /
