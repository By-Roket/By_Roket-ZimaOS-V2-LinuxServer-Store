name: linuxserver-tvheadend
services:
  tvheadend:
    image: linuxserver/tvheadend:version-fcd987f0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      RUN_OPTS: ''
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
      - container: RUN_OPTS
        description:
          en_US: Optionally specify additional arguments to be passed. See Additional
            runtime parameters. [OPTIONAL]
    ports:
    - target: 9981
      published: 9981
      protocol: tcp
    - target: 9982
      published: 9982
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    - type: bind
      source: /DATA/AppData/$AppID/recordings
      target: /recordings
    devices:
    - /dev/dri:/dev/dri
    - /dev/dvb:/dev/dvb
    container_name: tvheadend-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: tvheadend
  description:
    en_US: 'Tvheadend works as a proxy server: is a TV streaming server and recorder
      for Linux, FreeBSD and Android supporting DVB-S, DVB-S2, DVB-C, DVB-T, ATSC,
      ISDB-T, IPTV, SAT>IP and HDHomeRun as input sources. Tvheadend offers the HTTP
      (VLC, MPlayer), HTSP (Kodi, Movian) and SAT>IP streaming. Multiple EPG sources
      are supported (over-the-air DVB and ATSC including OpenTV DVB extensions, XMLTV,
      PyXML).'
  tagline:
    en_US: 'Works as a proxy server: is a TV streaming server and recorder for Linux,
      FreeBSD and Android supporting DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV,
      SAT>IP and HDHomeRun as input sources. Tvheadend offers the HTTP (VLC, MPlayer),
      HTSP (Kodi, Movian) and SAT>IP streaming. Multiple EPG sources are supported
      (over-the-air DVB and ATSC including OpenTV DVB extensions, XMLTV, PyXML).'
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/tvheadend-big.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/tvheadend-big.png
  title:
    en_US: Tvheadend
  category: Media
  id: by-roket.linuxserver.tvheadend
  version: version-fcd987f0
  index: /
  port_map: '9981'
