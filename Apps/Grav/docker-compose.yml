name: linuxserver-grav
services:
  grav:
    image: linuxserver/grav:2.0.23
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: grav-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: grav
  description:
    en_US: Grav is a Fast, Simple, and Flexible, file-based Web-platform.
  tagline:
    en_US: A Fast, Simple, and Flexible, file-based Web-platform.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/grav-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/grav-logo.png
  title:
    en_US: Grav (LinuxServer.io)
  category: Others
  id: by-roket.linuxserver.grav
  port_map: '80'
  version: 2.0.23
  index: /
