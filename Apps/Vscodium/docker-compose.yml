name: linuxserver-vscodium
services:
  vscodium:
    image: linuxserver/vscodium:1.126.04524
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/vscodium/config
      target: /config
x-casaos:
  architectures:
  - amd64
  - arm64
  main: vscodium
  description:
    en_US: VSCodium is a community-driven, freely-licensed binary distribution of
      Microsoft’s editor VS Code.
  tagline:
    en_US: A community-driven, freely-licensed binary distribution of Microsoft’s
      editor VS Code.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/vscodium-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/vscodium-icon.png
  title:
    en_US: Vscodium
  category: Developer
  port_map: '3000'
  id: by-roket.linuxserver.vscodium
  version: 1.126.04524
  index: /
