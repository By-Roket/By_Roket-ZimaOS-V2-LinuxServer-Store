name: linuxserver-nano-wallet
services:
  nano-wallet:
    image: linuxserver/nano-wallet:1.3.2
    restart: unless-stopped
    environment: {}
    x-casaos:
      envs: []
    ports:
    - target: 80
      published: 80
      protocol: tcp
    container_name: nano-wallet-by-roket
x-casaos:
  architectures:
  - amd64
  - arm
  - arm64
  main: nano-wallet
  description:
    en_US: Nano-wallet is a digital payment protocol designed to be accessible and
      lightweight, with a focus on removing inefficiencies present in other cryptocurrencies.
      With ultrafast transactions and zero fees on a secure, green and decentralized
      network, this makes Nano ideal for everyday transactions. This container is
      a simple nginx wrapper for the light wallet located here. You will need to pass
      a valid RPC host when accessing this container.
  tagline:
    en_US: A digital payment protocol designed to be accessible and lightweight, with
      a focus on removing inefficiencies present in other cryptocurrencies. With ultrafast
      transactions and zero fees on a secure, green and decentralized network, this
      makes Nano ideal for everyday transactions. This container is a simple nginx
      wrapper for the light wallet located here. You will need to pass a valid RPC
      host when accessing this container.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/linuxserver-ls-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/linuxserver-ls-icon.png
  title:
    en_US: Nano wallet
  category: Networking
  port_map: '80'
  id: by-roket.linuxserver.nano-wallet
  version: 1.3.2
  index: /
