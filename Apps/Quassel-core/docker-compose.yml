name: linuxserver-quassel-core
services:
  quassel-core:
    image: linuxserver/quassel-core:0.14.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      RUN_OPTS: ''
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: for UserID
      - container: PGID
        description:
          en_US: for GroupID
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
      - container: RUN_OPTS
        description:
          en_US: Custom CLI options for Quassel
    ports:
    - target: 4242
      published: 4242
      protocol: tcp
    - target: 113
      published: 10113
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: quassel-core-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: quassel-core
  description:
    en_US: 'Visit homepage: https://hub.docker.com/r/linuxserver/quassel-core/'
  tagline:
    en_US: A modern, cross-platform, distributed IRC client, meaning that one (or
      multiple) client(s) can attach to and detach from a central core. This container
      handles the IRC connection (quasselcore) and requires a desktop client (quasselclient)
      to be used and configured. It is designed to be always on and will keep your
      identity present in IRC even when your clients cannot be online. Backlog (history)
      is downloaded by your client upon reconnection allowing infinite scrollback
      through time.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/quassel-core-icon.png
  thumbnail: http://icons.iconarchive.com/icons/oxygen-icons.org/oxygen/256/Apps-quassel-icon.png
  title:
    en_US: Quassel core
  category: Developer
  project_url: http://quassel-irc.org/
  id: by-roket.linuxserver.quassel-core
  version: 0.14.0
  index: /
  port_map: ''
