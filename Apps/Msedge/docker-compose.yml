name: linuxserver-msedge
services:
  msedge:
    image: linuxserver/msedge:152.0.4191
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      EDGE_CLI: ''
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
      - container: EDGE_CLI
        description:
          en_US: Specify one or multiple Chromium CLI flags, this string will be passed
            to the application in full. [OPTIONAL]
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: msedge-by-roket
x-casaos:
  architectures:
  - amd64
  main: msedge
  description:
    en_US: Microsoft Edge is a cross-platform web browser developed by Microsoft and
      based on Chromium.
  tagline:
    en_US: A cross-platform web browser developed by Microsoft and based on Chromium.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/edge-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/edge-logo.png
  title:
    en_US: Msedge (LinuxServer.io)
  category: Others
  id: by-roket.linuxserver.msedge
  port_map: '3000'
  version: 152.0.4191
  index: /
