name: linuxserver-ardour
services:
  ardour:
    image: linuxserver/ardour:version-2026-06-19
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: ardour-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: ardour
  description:
    en_US: Ardour is an open source, collaborative effort of a worldwide team including
      musicians, programmers, and professional recording engineers.
  tagline:
    en_US: An open source, collaborative effort of a worldwide team including musicians,
      programmers, and professional recording engineers.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/ardour-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/ardour-logo.png
  title:
    en_US: Ardour
  category: Others
  port_map: '3000'
  id: by-roket.linuxserver.ardour
  version: version-2026-06-19
  index: /
