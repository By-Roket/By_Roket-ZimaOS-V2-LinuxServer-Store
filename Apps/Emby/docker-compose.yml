name: linuxserver-emby
services:
  emby:
    image: linuxserver/emby:4.9.5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 8096
      published: 8096
      protocol: tcp
    - target: 8920
      published: 8920
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    - type: bind
      source: /DATA/AppData/$AppID/data/tvshows
      target: /data/tvshows
    - type: bind
      source: /DATA/AppData/$AppID/data/movies
      target: /data/movies
    - type: bind
      source: /opt/vc/lib
      target: /opt/vc/lib
    container_name: emby-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: emby
  description:
    en_US: Emby organizes video, music, live TV, and photos from personal media libraries
      and streams them to smart TVs, streaming boxes and mobile devices. This container
      is packaged as a standalone emby Media Server.
  tagline:
    en_US: Organizes video, music, live TV, and photos from personal media libraries
      and streams them to smart TVs, streaming boxes and mobile devices. This container
      is packaged as a standalone emby Media Server.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/emby-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/emby-logo.png
  title:
    en_US: Emby (LinuxServer.io)
  category: Media
  id: by-roket.linuxserver.emby
  version: 4.9.5
  index: /
  port_map: '8096'
