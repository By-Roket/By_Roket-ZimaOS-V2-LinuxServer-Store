name: linuxserver-limnoria
services:
  limnoria:
    image: linuxserver/limnoria:2026.5.8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 8080
      published: 8080
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: limnoria-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: limnoria
  description:
    en_US: Limnoria A robust, full-featured, and user/programmer-friendly Python IRC
      bot, with many existing plugins. Successor of the well-known Supybot.
  tagline:
    en_US: A robust, full-featured, and user/programmer-friendly Python IRC bot, with
      many existing plugins. Successor of the well-known Supybot.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/limnoria-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/limnoria-icon.png
  title:
    en_US: Limnoria (LinuxServer.io)
  category: Others
  id: by-roket.linuxserver.limnoria
  port_map: '8080'
  version: 2026.5.8
  index: /
