name: linuxserver-d2-builder
services:
  d2-builder:
    image: linuxserver/d2-builder:0.6.8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: for UserID
      - container: PGID
        description:
          en_US: for GroupID
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: d2-builder-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: d2-builder
  description:
    en_US: This container needs special attention. Please check https://hub.docker.com/r/linuxserver/d2-builder
      for details.
  tagline:
    en_US: 'This container needs special attention. Please check https://hub. Docker.
      Com/r/linuxserver/d2-builder for details. '
  developer: LinuxServer.io
  author: WisdomSky
  icon: ''
  thumbnail: ''
  title:
    en_US: D2 builder
  category: Developer
  port_map: '80'
  id: by-roket.linuxserver.d2-builder
  version: 0.6.8
  index: /
