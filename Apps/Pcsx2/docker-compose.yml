name: linuxserver-pcsx2
services:
  pcsx2:
    image: linuxserver/pcsx2:2.8.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: pcsx2-by-roket
x-casaos:
  architectures:
  - amd64
  main: pcsx2
  description:
    en_US: PCSX2 is an open source PS2 Emulator.
  tagline:
    en_US: An open source PS2 Emulator.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/pcsx2-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/pcsx2-logo.png
  title:
    en_US: Pcsx2 (LinuxServer.io)
  category: Others
  id: by-roket.linuxserver.pcsx2
  port_map: '3000'
  version: 2.8.0
  index: /
