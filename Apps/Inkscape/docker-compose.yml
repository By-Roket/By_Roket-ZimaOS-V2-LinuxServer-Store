name: linuxserver-inkscape
services:
  inkscape:
    image: linuxserver/inkscape:1.4.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: inkscape-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: inkscape
  description:
    en_US: Inkscape is professional quality vector graphics software which runs on
      Linux, Mac OS X and Windows desktop computers.
  tagline:
    en_US: Professional quality vector graphics software which runs on Linux, Mac
      OS X and Windows desktop computers.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/inkscape-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/inkscape-logo.png
  title:
    en_US: Inkscape (LinuxServer.io)
  category: Others
  id: by-roket.linuxserver.inkscape
  port_map: '3000'
  version: 1.4.2
  index: /
