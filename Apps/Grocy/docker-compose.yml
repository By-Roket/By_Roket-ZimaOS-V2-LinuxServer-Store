name: linuxserver-grocy
services:
  grocy:
    image: linuxserver/grocy:4.6.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 9283
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: grocy-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: grocy
  description:
    en_US: 'Grocy is an ERP system for your kitchen! Cut down on food waste, and manage
      your chores with this brilliant utility. Keep track of your purchases, how much
      food you are wasting, what chores need doing and what batteries need charging
      with this proudly Open Source tool For more information on grocy visit their
      website and check it out: https://grocy.info'
  tagline:
    en_US: 'An ERP system for your kitchen. Cut down on food waste, and manage your
      chores with this brilliant utility. Keep track of your purchases, how much food
      you are wasting, what chores need doing and what batteries need charging with
      this proudly Open Source tool For more information on grocy visit their website
      and check it out: https://grocy. Info'
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/grocy-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/grocy-logo.png
  title:
    en_US: Grocy
  category: Others
  port_map: '80'
  id: by-roket.linuxserver.grocy
  version: 4.6.0
  index: /
