name: linuxserver-mediaelch
services:
  mediaelch:
    image: linuxserver/mediaelch:2.12.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: mediaelch-by-roket
x-casaos:
  architectures:
  - amd64
  main: mediaelch
  description:
    en_US: MediaElch is a MediaManager for Kodi. Information about Movies, TV Shows,
      Concerts and Music are stored as nfo files. Fanarts are downloaded automatically
      from fanart.tv. Using the nfo generator, MediaElch can be used with other MediaCenters
      as well.
  tagline:
    en_US: A MediaManager for Kodi. Information about Movies, TV Shows, Concerts and
      Music are stored as nfo files. Fanarts are downloaded automatically from fanart.
      Tv. Using the nfo generator, MediaElch can be used with other MediaCenters as
      well.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mediaelch-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mediaelch-logo.png
  title:
    en_US: Mediaelch
  category: Media
  port_map: '3000'
  id: by-roket.linuxserver.mediaelch
  version: 2.12.0
  index: /
