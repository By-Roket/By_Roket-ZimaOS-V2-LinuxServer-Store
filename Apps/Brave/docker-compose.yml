name: linuxserver-brave
services:
  brave:
    image: linuxserver/brave:1.94.119
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: brave-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: brave
  description:
    en_US: The Brave browser is a fast, private and secure web browser for PC, Mac
      and mobile.
  tagline:
    en_US: A fast, private and secure web browser for PC, Mac and mobile.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/brave-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/brave-logo.png
  title:
    en_US: Brave (LinuxServer.io)
  category: Others
  id: by-roket.linuxserver.brave
  port_map: '3000'
  version: 1.94.119
  index: /
