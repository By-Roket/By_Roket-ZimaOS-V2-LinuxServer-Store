name: linuxserver-emulatorjs
services:
  emulatorjs:
    image: linuxserver/emulatorjs:1.9.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SUBFOLDER: ''
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: for UserID
      - container: PGID
        description:
          en_US: for GroupID
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
      - container: SUBFOLDER
        description:
          en_US: Specify a subfolder for reverse proxies IE '/FOLDER/'
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 80
      published: 80
      protocol: tcp
    - target: 4001
      published: 4001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    - type: bind
      source: /DATA/AppData/$AppID/data
      target: /data
    container_name: emulatorjs-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: emulatorjs
  description:
    en_US: Emulatorjs - In browser web based emulation portable to nearly any device
      for many retro consoles. A mix of emulators is used between Libretro and EmulatorJS.
  tagline:
    en_US: 'In browser web based emulation portable to nearly any device for many
      retro consoles. A mix of emulators is used between Libretro and EmulatorJS. '
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/emulatorjs-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/emulatorjs-logo.png
  title:
    en_US: Emulatorjs
  category: Others
  port_map: '80'
  id: by-roket.linuxserver.emulatorjs
  version: 1.9.2
  index: /
