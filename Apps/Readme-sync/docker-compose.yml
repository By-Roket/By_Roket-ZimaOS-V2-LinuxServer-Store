name: linuxserver-readme-sync
services:
  readme-sync:
    image: linuxserver/readme-sync:84f2d0c3-ls27
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: for UserID
      - container: PGID
        description:
          en_US: for GroupID
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: readme-sync-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: readme-sync
  description:
    en_US: This container needs special attention. Please check https://hub.docker.com/r/linuxserver/readme-sync
      for details.
  tagline:
    en_US: 'This container needs special attention. Please check https://hub. Docker.
      Com/r/linuxserver/readme-sync for details. '
  developer: LinuxServer.io
  author: WisdomSky
  icon: ''
  thumbnail: ''
  title:
    en_US: Readme sync
  category: Developer
  port_map: '80'
  id: by-roket.linuxserver.readme-sync
  version: 84f2d0c3-ls27
  index: /
