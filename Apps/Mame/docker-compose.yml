name: linuxserver-mame
services:
  mame:
    image: linuxserver/mame:version-0.289dfsg1-0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    - type: bind
      source: /DATA/AppData/$AppID/mame:ro
      target: /mame:ro
    container_name: mame-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: mame
  description:
    en_US: MAME is a free and open-source emulator designed to emulate the hardware
      of arcade games, video game consoles, old computers and other systems in software
      on modern personal computers.
  tagline:
    en_US: A free and open-source emulator designed to emulate the hardware of arcade
      games, video game consoles, old computers and other systems in software on modern
      personal computers.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mame-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mame-logo.png
  title:
    en_US: Mame (LinuxServer.io)
  category: Media
  id: by-roket.linuxserver.mame
  port_map: '3000'
  version: version-0.289dfsg1-0
  index: /
