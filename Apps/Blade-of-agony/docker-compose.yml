name: linuxserver-blade-of-agony
services:
  blade-of-agony:
    image: linuxserver/blade-of-agony:3.1.20260816
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: blade-of-agony-by-roket
x-casaos:
  architectures:
  - amd64
  main: blade-of-agony
  description:
    en_US: 'Wolfenstein: Blade of Agony is a story-driven WWII shooter inspired by
      Wolfenstein and Doom.'
  tagline:
    en_US: A story-driven WWII shooter inspired by Wolfenstein and Doom.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/boa-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/boa-logo.png
  title:
    en_US: Blade of-agony
  category: Others
  port_map: '3000'
  id: by-roket.linuxserver.blade-of-agony
  version: 3.1.20260816
  index: /
