name: linuxserver-pidgin
services:
  pidgin:
    image: linuxserver/pidgin:2.14.14
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: pidgin-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: pidgin
  description:
    en_US: Pidgin is a chat program which lets you log into accounts on multiple chat
      networks simultaneously. This means that you can be chatting with friends on
      XMPP and sitting in an IRC channel at the same time.
  tagline:
    en_US: A chat program which lets you log into accounts on multiple chat networks
      simultaneously. This means that you can be chatting with friends on XMPP and
      sitting in an IRC channel at the same time.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/pidgin-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/pidgin-logo.png
  title:
    en_US: Pidgin
  category: Social
  port_map: '3000'
  id: by-roket.linuxserver.pidgin
  version: 2.14.14
  index: /
