name: linuxserver-diskover
services:
  diskover:
    image: linuxserver/diskover:2.3.5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ES_HOST: ''
      ES_PORT: ''
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
      - container: ES_HOST
        description:
          en_US: ElasticSearch host (optional)
      - container: ES_PORT
        description:
          en_US: ElasticSearch port (optional)
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    - type: bind
      source: /DATA/AppData/$AppID/data
      target: /data
    container_name: diskover-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: diskover
  description:
    en_US: Diskover is an open source file system indexer that uses Elasticsearch
      to index and manage data across heterogeneous storage systems.
  tagline:
    en_US: An open source file system indexer that uses Elasticsearch to index and
      manage data across heterogeneous storage systems.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/diskoverdata/diskover-community/master/diskover-web/public/images/diskover.png
  thumbnail: https://raw.githubusercontent.com/diskoverdata/diskover-community/master/diskover-web/public/images/diskover.png
  title:
    en_US: Diskover
  category: Others
  port_map: '80'
  id: by-roket.linuxserver.diskover
  version: 2.3.5
  index: /
