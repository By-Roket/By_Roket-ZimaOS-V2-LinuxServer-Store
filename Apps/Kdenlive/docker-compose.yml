name: linuxserver-kdenlive
services:
  kdenlive:
    image: linuxserver/kdenlive:26.08.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: kdenlive-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: kdenlive
  description:
    en_US: Kdenlive is a powerful free and open source cross-platform video editing
      program made by the KDE community. Feature rich and production ready.
  tagline:
    en_US: A powerful free and open source cross-platform video editing program made
      by the KDE community. Feature rich and production ready.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/kdenlive-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/kdenlive-logo.png
  title:
    en_US: Kdenlive
  category: Media
  port_map: '3000'
  id: by-roket.linuxserver.kdenlive
  version: 26.08.0
  index: /
