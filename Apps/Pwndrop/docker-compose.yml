name: linuxserver-pwndrop
services:
  pwndrop:
    image: linuxserver/pwndrop:1.0.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SECRET_PATH: ''
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
      - container: SECRET_PATH
        description:
          en_US: Secret path for admin access. Defaults to /pwndrop. This parameter
            only takes effect during initial install; it can later be changed in the
            web gui. [OPTIONAL]
    ports:
    - target: 8080
      published: 8080
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: pwndrop-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: pwndrop
  description:
    en_US: Pwndrop is a self-deployable file hosting service for sending out red teaming
      payloads or securely sharing your private files over HTTP and WebDAV.
  tagline:
    en_US: A self-deployable file hosting service for sending out red teaming payloads
      or securely sharing your private files over HTTP and WebDAV.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/kgretzky/pwndrop/master/media/pwndrop-logo-512.png
  thumbnail: https://raw.githubusercontent.com/kgretzky/pwndrop/master/media/pwndrop-logo-512.png
  title:
    en_US: Pwndrop
  category: Others
  port_map: '8080'
  id: by-roket.linuxserver.pwndrop
  version: 1.0.1
  index: /
