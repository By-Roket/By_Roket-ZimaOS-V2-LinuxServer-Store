name: linuxserver-dosbox-staging
services:
  dosbox-staging:
    image: linuxserver/dosbox-staging:0.83.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: dosbox-staging-by-roket
x-casaos:
  architectures:
  - amd64
  main: dosbox-staging
  description:
    en_US: DOSBox Staging is a modern continuation of DOSBox a free and open-source
      emulator that enables the execution of MS-DOS software, especially video games.
  tagline:
    en_US: A modern continuation of DOSBox a free and open-source emulator that enables
      the execution of MS-DOS software, especially video games.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/dosbox-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/dosbox-logo.png
  title:
    en_US: Dosbox staging (LinuxServer.io)
  category: Media
  id: by-roket.linuxserver.dosbox-staging
  port_map: '3000'
  version: 0.83.0
  index: /
