name: linuxserver-resilio-sync
services:
  resilio-sync:
    image: linuxserver/resilio-sync:3.1.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 8888
      published: 8888
      protocol: tcp
    - target: 55555
      published: 55555
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    - type: bind
      source: /DATA/AppData/$AppID/downloads
      target: /downloads
    - type: bind
      source: /DATA/AppData/$AppID/sync
      target: /sync
    container_name: resilio-sync-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: resilio-sync
  description:
    en_US: Resilio-sync (formerly BitTorrent Sync) uses the BitTorrent protocol to
      sync files and folders between all of your devices. There are both free and
      paid versions, this container supports both. There is an official sync image
      but we created this one as it supports user mapping to simplify permissions
      for volumes.
  tagline:
    en_US: (formerly BitTorrent Sync) uses the BitTorrent protocol to sync files and
      folders between all of your devices. There are both free and paid versions,
      this container supports both. There is an official sync image but we created
      this one as it supports user mapping to simplify permissions for volumes.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/resilio-sync-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/resilio-sync-logo.png
  title:
    en_US: Resilio sync
  category: Others
  id: by-roket.linuxserver.resilio-sync
  version: 3.1.2
  index: /
  port_map: '8888'
