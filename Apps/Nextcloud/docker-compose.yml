name: linuxserver-nextcloud
services:
  nextcloud:
    image: linuxserver/nextcloud:34.0.3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 443
      published: 443
      protocol: tcp
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    - type: bind
      source: /DATA/AppData/$AppID/data
      target: /data
    container_name: nextcloud-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: nextcloud
  description:
    en_US: Nextcloud gives you access to all your files wherever you are. Where are
      your photos and documents? With Nextcloud you pick a server of your choice,
      at home, in a data center or at a provider. And that is where your files will
      be. Nextcloud runs on that server, protecting your data and giving you access
      from your desktop or mobile devices. Through Nextcloud you also access, sync
      and share your existing data on that FTP drive at the office, a Dropbox or a
      NAS you have at home.
  tagline:
    en_US: Gives you access to all your files wherever you are. Where are your photos
      and documents. With Nextcloud you pick a server of your choice, at home, in
      a data center or at a provider. And that is where your files will be. Nextcloud
      runs on that server, protecting your data and giving you access from your desktop
      or mobile devices. Through Nextcloud you also access, sync and share your existing
      data on that FTP drive at the office, a Dropbox or a NAS you have at home.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/nextcloud-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/nextcloud-icon.png
  title:
    en_US: Nextcloud (LinuxServer.io)
  category: Productivity
  id: by-roket.linuxserver.nextcloud
  port_map: '80'
  version: 34.0.3
  index: /
