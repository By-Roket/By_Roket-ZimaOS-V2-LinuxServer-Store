name: linuxserver-lm-studio
services:
  lm-studio:
    image: linuxserver/lm-studio:2026-08-21-ls23
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: lm-studio-by-roket
x-casaos:
  architectures:
  - amd64
  main: lm-studio
  description:
    en_US: LM Studio can run local AI models like gpt-oss, Llama, Gemma, Qwen, and
      DeepSeek privately on your computer.
  tagline:
    en_US: Can run local AI models like gpt-oss, Llama, Gemma, Qwen, and DeepSeek
      privately on your computer.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/lmstudio-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/lmstudio-logo.png
  title:
    en_US: Lm studio
  category: Others
  port_map: '3000'
  id: by-roket.linuxserver.lm-studio
  version: 2026-08-21-ls23
  index: /
