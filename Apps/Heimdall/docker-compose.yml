name: linuxserver-heimdall
services:
  heimdall:
    image: linuxserver/heimdall:2.8.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ALLOW_INTERNAL_REQUESTS: ''
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
      - container: ALLOW_INTERNAL_REQUESTS
        description:
          en_US: By default, Heimdall blocks lookup requests to private or reserved
            IP addresses, if your instance is not exposed to the internet, or is behind
            some level of authentication, you can set this to true to allow requests
            to private IP addresses. [OPTIONAL]
    ports:
    - target: 80
      published: 80
      protocol: tcp
    - target: 443
      published: 443
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: heimdall-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: heimdall
  description:
    en_US: Heimdall is a way to organise all those links to your most used web sites
      and web applications in a simple way. Simplicity is the key to Heimdall. Why
      not use it as your browser start page? It even has the ability to include a
      search bar using either Google, Bing or DuckDuckGo.
  tagline:
    en_US: A way to organise all those links to your most used web sites and web applications
      in a simple way. Simplicity is the key to Heimdall. Why not use it as your browser
      start page. It even has the ability to include a search bar using either Google,
      Bing or DuckDuckGo.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/heimdall-banner.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/heimdall-banner.png
  title:
    en_US: Heimdall
  category: Others
  port_map: '80'
  id: by-roket.linuxserver.heimdall
  version: 2.8.2
  index: /
