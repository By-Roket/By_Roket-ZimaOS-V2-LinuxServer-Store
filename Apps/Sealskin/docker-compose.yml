name: linuxserver-sealskin
services:
  sealskin:
    image: linuxserver/sealskin:0.1.39
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HOST_URL: ''
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
      - container: HOST_URL
        description:
          en_US: On initial setup this will be used to fill in the default admin configuration
            file in the /config directory, if unset the string HOST_URL will need
            to be replaced. [OPTIONAL]
    ports:
    - target: 8443
      published: 8443
      protocol: tcp
    - target: 8000
      published: 8000
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    - type: bind
      source: /DATA/AppData/$AppID/storage
      target: /storage
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
    container_name: sealskin-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: sealskin
  description:
    en_US: Sealskin is a self-hosted, client-server platform that enables users to
      run powerful, containerized desktop applications streamed directly to a web
      browser. It uses a browser extension to intercept user actions—such as clicking
      a link or downloading a file and redirects them to a secure, isolated application
      environment running on a remote server.
  tagline:
    en_US: A self-hosted, client-server platform that enables users to run powerful,
      containerized desktop applications streamed directly to a web browser. It uses
      a browser extension to intercept user actions—such as clicking a link or downloading
      a file and redirects them to a secure, isolated application environment running
      on a remote server.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/selkies-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/selkies-logo.png
  title:
    en_US: Sealskin
  category: Others
  port_map: '8000'
  id: by-roket.linuxserver.sealskin
  version: 0.1.39
  index: /
