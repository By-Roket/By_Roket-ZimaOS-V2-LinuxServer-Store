name: linuxserver-adguardhome-sync
services:
  adguardhome-sync:
    image: linuxserver/adguardhome-sync:0.9.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONFIGFILE: ''
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
      - container: CONFIGFILE
        description:
          en_US: Set a custom config file. [OPTIONAL]
    ports:
    - target: 8080
      published: 8080
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/adguardhome-sync/config
      target: /config
x-casaos:
  architectures:
  - amd64
  - arm64
  main: adguardhome-sync
  description:
    en_US: Adguardhome-sync is a tool to synchronize AdGuardHome config to replica
      instances.
  tagline:
    en_US: A tool to synchronize AdGuardHome config to replica instances.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/adguardhomesync-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/adguardhomesync-icon.png
  title:
    en_US: Adguardhome sync
  category: Networking
  port_map: '8080'
  id: by-roket.linuxserver.adguardhome-sync
  version: 0.9.2
  index: /
