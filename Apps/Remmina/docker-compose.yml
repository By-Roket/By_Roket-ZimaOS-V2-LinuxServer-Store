name: linuxserver-remmina
services:
  remmina:
    image: linuxserver/remmina:1.4.40
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
      - container: PUID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the UID to use here.
      - container: PGID
        description:
          en_US: Run 'id [USER]' for the owner of the host volume directories to get
            the GID to use here.
      - container: TZ
        description:
          en_US: specify a timezone to use, see this list.
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    container_name: remmina-by-roket
x-casaos:
  architectures:
  - amd64
  - arm64
  main: remmina
  description:
    en_US: Remmina is a remote desktop client written in GTK, aiming to be useful
      for system administrators and travellers, who need to work with lots of remote
      computers in front of either large or tiny screens. Remmina supports multiple
      network protocols, in an integrated and consistent user interface. Currently
      RDP, VNC, SPICE, SSH and EXEC are supported.
  tagline:
    en_US: A remote desktop client written in GTK, aiming to be useful for system
      administrators and travellers, who need to work with lots of remote computers
      in front of either large or tiny screens. Remmina supports multiple network
      protocols, in an integrated and consistent user interface. Currently RDP, VNC,
      SPICE, SSH and EXEC are supported.
  developer: LinuxServer.io
  author: WisdomSky
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/remmina-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/remmina-icon.png
  title:
    en_US: Remmina
  category: Networking
  port_map: '3000'
  id: by-roket.linuxserver.remmina
  version: 1.4.40
  index: /
