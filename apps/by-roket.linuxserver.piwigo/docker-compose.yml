name: linuxserver-piwigo
services:
  piwigo:
    image: linuxserver/piwigo:16.4.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/gallery
        target: /gallery
    container_name: piwigo-by-roket
