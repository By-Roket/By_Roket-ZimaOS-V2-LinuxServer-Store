name: linuxserver-diskover
services:
  diskover:
    image: linuxserver/diskover:2.3.5@sha256:3ba440c434f80e8a6bb86f39a16908939a4ea24a86a4c8f7f25e597d585aeb61
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ES_HOST: ''
      ES_PORT: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    container_name: diskover-by-roket
