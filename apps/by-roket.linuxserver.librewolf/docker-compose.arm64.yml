name: linuxserver-librewolf
services:
  librewolf:
    image: linuxserver/librewolf:155.0.1@sha256:e2d1021038c097b748282d63d1aedfdb93463c3e8172c54c1c13915e7eeafbaa
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LIBREWOLF_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: librewolf-by-roket
x-casaos:
  main: librewolf
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.librewolf/assets/icon.png
  title:
    en_US: Librewolf (LinuxServer.io)
  id: by-roket.linuxserver.librewolf
  port_map: '3000'
  version: 155.0.1
  index: /
