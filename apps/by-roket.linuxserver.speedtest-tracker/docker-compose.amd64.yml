name: linuxserver-speedtest-tracker
services:
  speedtest-tracker:
    image: linuxserver/speedtest-tracker:1.15.0@sha256:a655c75b286f5f2928893f1e9591ba10377910872a675b3559f26ef2bff8a69f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_KEY: ''
      APP_URL: ''
      DB_CONNECTION: ''
      SPEEDTEST_SCHEDULE: ''
      SPEEDTEST_SERVERS: ''
      DB_HOST: ''
      DB_PORT: ''
      DB_DATABASE: ''
      DB_USERNAME: ''
      DB_PASSWORD: ''
      DISPLAY_TIMEZONE: ''
      PRUNE_RESULTS_OLDER_THAN: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: speedtest-tracker-by-roket
x-casaos:
  main: speedtest-tracker
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.speedtest-tracker/assets/icon.png
  title:
    en_US: Speedtest tracker (LinuxServer.io)
  id: by-roket.linuxserver.speedtest-tracker
  port_map: '80'
  version: 1.15.0
  index: /
