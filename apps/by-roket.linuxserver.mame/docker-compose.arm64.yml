name: linuxserver-mame
services:
  mame:
    image: linuxserver/mame:version-0.289dfsg1-0@sha256:2fb777708b1f45aaaffbe8dddb93e72b98c3ccceabdc91b261ceaaf58eac99ef
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mame/config
        target: /config
      - type: bind
        source: /DATA/AppData/mame/mame:ro
        target: /mame:ro
x-casaos:
  main: mame
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.mame/assets/icon.png
  title:
    en_US: Mame
  port_map: '3000'
  id: by-roket.linuxserver.mame
  version: version-0.289dfsg1-0
  index: /
