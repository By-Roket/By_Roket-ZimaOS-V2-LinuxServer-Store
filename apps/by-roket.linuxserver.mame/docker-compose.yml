name: linuxserver-mame
services:
  mame:
    image: linuxserver/mame:version-0.289dfsg1-0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/mame:ro
        target: /mame:ro
    container_name: mame-by-roket
