name: linuxserver-build-agent
services:
  build-agent:
    image: linuxserver/build-agent:version-0296acb5@sha256:ae99188de172641b9ea660842567fde8e3d2e2824d7434e786b850b48cbb75b0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/build-agent/config
        target: /config
x-casaos:
  main: build-agent
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.build-agent/assets/icon.png
  title:
    en_US: Build agent
  port_map: '80'
  id: by-roket.linuxserver.build-agent
  version: version-0296acb5
  index: /
