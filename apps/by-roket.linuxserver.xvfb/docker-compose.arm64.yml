name: linuxserver-xvfb
services:
  xvfb:
    image: linuxserver/xvfb:debiantrixie-version-9d327c0f@sha256:ae7c2a821f70865e96f97612b126b8f797e6946898e2b4d0cc21626d9f314c2f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /srv/lsio/xvfb/config
        target: /config
    container_name: xvfb-by-roket
x-casaos:
  main: xvfb
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.xvfb/assets/icon.png
  title:
    en_US: Xvfb
  port_map: '80'
  id: by-roket.linuxserver.xvfb
  version: debiantrixie-version-9d327c0f
  index: /
