name: linuxserver-zen
services:
  zen:
    image: linuxserver/zen:1.22.1@sha256:09c4ce39a4422a086352c8b2164272744e688228beccc4e823460299020b5380
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: zen-by-roket
x-casaos:
  main: zen
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.zen/assets/icon.png
  title:
    en_US: Zen (LinuxServer.io)
  id: by-roket.linuxserver.zen
  port_map: '3000'
  version: 1.22.1
  index: /
