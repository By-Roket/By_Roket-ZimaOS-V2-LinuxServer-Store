name: linuxserver-budge
services:
  budge:
    image: linuxserver/budge:0.0.9@sha256:e4b88a2b3b262ea9187f451505afb85b3fd1c5ac19e7186d71bca236d986b743
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: budge-by-roket
x-casaos:
  main: budge
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.budge/assets/icon.png
  title:
    en_US: Budge (LinuxServer.io)
  id: by-roket.linuxserver.budge
  port_map: '80'
  version: 0.0.9
  index: /
