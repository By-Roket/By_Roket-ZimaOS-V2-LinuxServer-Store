name: linuxserver-budge
services:
  budge:
    image: linuxserver/budge:0.0.9@sha256:a38541a63242cd9924acd5ed624fd08fb3f0080cc89d7c54a71aa431634130c2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: budge-by-roket
x-casaos:
  main: budge
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.budge/assets/icon.png
  title:
    en_US: Budge
  port_map: '80'
  id: by-roket.linuxserver.budge
  version: 0.0.9
  index: /
