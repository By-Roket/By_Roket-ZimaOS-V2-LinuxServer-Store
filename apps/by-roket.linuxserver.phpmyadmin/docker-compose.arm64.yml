name: linuxserver-phpmyadmin
services:
  phpmyadmin:
    image: linuxserver/phpmyadmin:5.2.3@sha256:1893d53a8ccd6c19a6040017225d3b88c172797aaba9f209a8d4c12ee130da56
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PMA_ARBITRARY: ''
      PMA_ABSOLUTE_URI: ''
      PMA_HOST: 172.17.0.1
      PMA_USER: casaos
      PMA_PASSWORD: casaos
    ports:
      - target: 8081
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: phpmyadmin-by-roket
x-casaos:
