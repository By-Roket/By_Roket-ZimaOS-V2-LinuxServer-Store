name: linuxserver-sabnzbd
services:
  sabnzbd:
    image: linuxserver/sabnzbd:5.1.3@sha256:a80172cf71fa038f6321f3a718c8c1176034c0de71e6c7e36b91e0f6b17adc81
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/incomplete-downloads
        target: /incomplete-downloads
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
    container_name: sabnzbd-by-roket
x-casaos:
