name: linuxserver-azahar
services:
  azahar:
    image: linuxserver/azahar:12125.1.3@sha256:b111e066d6b7bf7c78392a221e2cea50640febafd06b32ec02d90406de424a35
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: azahar-by-roket
x-casaos:
  main: azahar
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.azahar/assets/icon.png
  title:
    en_US: Azahar
  port_map: '3000'
  id: by-roket.linuxserver.azahar
  version: 12125.1.3
  index: /
