name: linuxserver-healthchecks
services:
  healthchecks:
    image: linuxserver/healthchecks:4.3.20260824@sha256:7bdbdf0a458ef5e47de9eb5be3e25d0b9aa7bb62352a484d0680198474d24266
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SECRET_KEY: ''
      SITE_ROOT: ''
      SITE_NAME: ''
      SUPERUSER_EMAIL: ''
      SUPERUSER_PASSWORD: ''
      ALLOWED_HOSTS: ''
      APPRISE_ENABLED: ''
      CSRF_TRUSTED_ORIGINS: ''
      DEBUG: ''
      DEFAULT_FROM_EMAIL: ''
      EMAIL_HOST: ''
      EMAIL_PORT: ''
      EMAIL_HOST_USER: ''
      EMAIL_HOST_PASSWORD: ''
      EMAIL_USE_TLS: ''
      INTEGRATIONS_ALLOW_PRIVATE_IPS: ''
      PING_EMAIL_DOMAIN: ''
      RP_ID: ''
      SITE_LOGO_URL: ''
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
      - target: 2525
        published: 2525
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: healthchecks-by-roket
x-casaos:
  main: healthchecks
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.healthchecks/assets/icon.png
  title:
    en_US: Healthchecks
  port_map: '8000'
  id: by-roket.linuxserver.healthchecks
  version: 4.3.20260824
  index: /
