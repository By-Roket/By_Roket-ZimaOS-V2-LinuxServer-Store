name: linuxserver-socket-proxy
services:
  app:
    image: linuxserver/socket-proxy:3.4.3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/socket-proxy/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.socket-proxy/assets/icon.png
  title:
    en_US: Socket proxy
  port_map: '80'
  id: by-roket.linuxserver.socket-proxy
  version: 3.4.3
  index: /
