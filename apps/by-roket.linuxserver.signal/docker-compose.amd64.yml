name: linuxserver-signal
services:
  signal:
    image: linuxserver/signal:8.25.0@sha256:73758a02dc011a511a3db0a1e271f6c13c4c5e0db4cc054f32fcd917f240ad73
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: signal-by-roket
x-casaos:
  main: signal
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.signal/assets/icon.png
  title:
    en_US: Signal
  port_map: '3000'
  id: by-roket.linuxserver.signal
  version: 8.25.0
  index: /
