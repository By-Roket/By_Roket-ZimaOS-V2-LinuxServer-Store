name: linuxserver-signal
services:
  signal:
    image: linuxserver/signal:8.29.0@sha256:b7f3c1e7b3893349f8d9b9d18f8213b9ec4b0c0c6f068108b33b3a93008519fa
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: signal-by-roket
x-casaos:
