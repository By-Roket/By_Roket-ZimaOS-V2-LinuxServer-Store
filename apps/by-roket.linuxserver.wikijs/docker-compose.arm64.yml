name: linuxserver-wikijs
services:
  wikijs:
    image: linuxserver/wikijs:2.5.314@sha256:b9c98e1fbae138161701900bfa1f7b4f6cc550a360c4b1e8e86291f8007f1a48
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DB_TYPE: ''
      DB_HOST: ''
      DB_PORT: ''
      DB_NAME: ''
      DB_USER: ''
      DB_PASS: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    container_name: wikijs-by-roket
x-casaos:
  main: wikijs
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.wikijs/assets/icon.svg
  title:
    en_US: Wikijs (LinuxServer.io)
  id: by-roket.linuxserver.wikijs
  port_map: '3000'
  version: 2.5.314
  index: /
