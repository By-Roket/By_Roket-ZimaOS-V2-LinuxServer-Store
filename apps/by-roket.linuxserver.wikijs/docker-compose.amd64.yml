name: linuxserver-wikijs
services:
  wikijs:
    image: linuxserver/wikijs:2.5.314@sha256:87855647deb54eb59ac0c802dee088bb387badc6ae1afd48cfb19c417cce5ca1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DB_TYPE: ''
      DB_HOST: ''
      DB_PORT: ''
      DB_NAME: ''
      DB_USER: ''
      DB_PASS: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    container_name: wikijs-by-roket
x-casaos:
  main: wikijs
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.wikijs/assets/icon.svg
  title:
    en_US: Wikijs (LinuxServer.io)
  id: by-roket.linuxserver.wikijs
  port_map: '3000'
  version: 2.5.314
  index: /
