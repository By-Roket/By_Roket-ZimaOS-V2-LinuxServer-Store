name: linuxserver-plex
services:
  plex:
    image: linuxserver/plex:1.43.4@sha256:b7606348383167084ac65ad97613e4789f722f58d3f718bbbddddf9f9d7bb984
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VERSION: ''
      PLEX_CLAIM: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/tv
        target: /tv
      - type: bind
        source: /DATA/AppData/$AppID/movies
        target: /movies
    container_name: plex-by-roket
x-casaos:
  main: plex
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.plex/assets/icon.png
  title:
    en_US: Plex (LinuxServer.io)
  id: by-roket.linuxserver.plex
  port_map: '80'
  version: 1.43.4
  index: /
