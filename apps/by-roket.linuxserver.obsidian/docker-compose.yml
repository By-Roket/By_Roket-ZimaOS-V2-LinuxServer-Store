name: linuxserver-obsidian
services:
  obsidian:
    image: linuxserver/obsidian:1.13.7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/obsidian/config
        target: /config
x-casaos:
  main: obsidian
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.obsidian/assets/icon.png
  title:
    en_US: Obsidian
  port_map: '3000'
  id: by-roket.linuxserver.obsidian
  version: 1.13.7
  index: /
