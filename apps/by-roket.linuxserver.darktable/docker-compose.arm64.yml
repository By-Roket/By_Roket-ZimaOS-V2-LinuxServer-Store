name: linuxserver-darktable
services:
  darktable:
    image: linuxserver/darktable:25.6.1@sha256:32c6c94ec7c35598131b7df21e46b6d03a0d9426bc7fd44d0f5924346bb117b0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: darktable-by-roket
