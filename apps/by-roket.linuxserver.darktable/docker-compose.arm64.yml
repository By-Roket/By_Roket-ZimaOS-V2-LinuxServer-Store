name: linuxserver-darktable
services:
  darktable:
    image: linuxserver/darktable:25.6.0@sha256:3c3b59d546fd32a0263d2d566733833496d3ff20ce4c6e0f66acd07de6a74c65
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/darktable/config
        target: /config
x-casaos:
  main: darktable
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.darktable/assets/icon.png
  title:
    en_US: Darktable
  port_map: '3000'
  id: by-roket.linuxserver.darktable
  version: 25.6.0
  index: /
