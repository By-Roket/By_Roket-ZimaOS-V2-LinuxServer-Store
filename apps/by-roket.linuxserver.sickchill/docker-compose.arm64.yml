name: linuxserver-sickchill
services:
  app:
    image: linuxserver/sickchill:2024.3.1@sha256:0b20c54a091efb39a802d555fa928babc3277eebcb973e4f78bad8f329115f7f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8081
        published: 8081
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/sickchill/config
        target: /config
      - type: bind
        source: /DATA/AppData/sickchill/downloads
        target: /downloads
      - type: bind
        source: /DATA/AppData/sickchill/tv
        target: /tv
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.sickchill/assets/icon.png
  title:
    en_US: Sickchill
  port_map: '8081'
  id: by-roket.linuxserver.sickchill
  version: 2024.3.1
  index: /
