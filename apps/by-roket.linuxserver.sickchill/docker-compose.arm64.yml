name: linuxserver-sickchill
services:
  sickchill:
    image: linuxserver/sickchill:2024.3.1@sha256:0b20c54a091efb39a802d555fa928babc3277eebcb973e4f78bad8f329115f7f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8081
        published: 8081
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
      - type: bind
        source: /DATA/AppData/$AppID/tv
        target: /tv
    container_name: sickchill-by-roket
