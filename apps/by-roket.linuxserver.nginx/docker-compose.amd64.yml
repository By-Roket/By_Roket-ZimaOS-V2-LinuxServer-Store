name: linuxserver-nginx
services:
  nginx:
    image: linuxserver/nginx:1.30.4@sha256:1ad2084d57e8a6517d662d6ddcc3d8104d1b832497b8c5bf938f6e4b3f4ea640
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      NGINX_AUTORELOAD: ''
      NGINX_AUTORELOAD_WATCHLIST: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: nginx-by-roket
x-casaos:
  main: nginx
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.nginx/assets/icon.png
