name: linuxserver-yaak
services:
  yaak:
    image: linuxserver/yaak:2026.6.0@sha256:daf442092bb7ed698b14f606a9ff395905a76544dd785fbdd4cb380fd7600831
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: yaak-by-roket
x-casaos:
  main: yaak
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.yaak/assets/icon.png
  title:
    en_US: Yaak
  port_map: '3000'
  id: by-roket.linuxserver.yaak
  version: 2026.6.0
  index: /
