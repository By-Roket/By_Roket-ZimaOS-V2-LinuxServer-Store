name: linuxserver-spotube
services:
  spotube:
    image: linuxserver/spotube:5.1.2@sha256:916633d1f418b92395820f5289fecb0bb393f281e66ed7da81f4406ea993a894
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: spotube-by-roket
