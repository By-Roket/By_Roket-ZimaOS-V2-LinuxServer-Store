name: linuxserver-doublecommander
services:
  app:
    image: linuxserver/doublecommander:version-c52510d6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/doublecommander/config
        target: /config
      - type: bind
        source: /DATA/AppData/doublecommander/data
        target: /data
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.doublecommander/assets/icon.png
  title:
    en_US: Doublecommander
  port_map: '3000'
  id: by-roket.linuxserver.doublecommander
  version: version-c52510d6
  index: /
