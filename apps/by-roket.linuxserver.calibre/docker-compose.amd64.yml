name: linuxserver-calibre
services:
  calibre:
    image: linuxserver/calibre:9.14.0@sha256:1c4303fe9db8365dd1d56901cdf24d798ae0c1c7ac59c1aee59c5af44759cbc4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PASSWORD: ''
      CLI_ARGS: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
      - target: 8181
        published: 8181
        protocol: tcp
      - target: 8081
        published: 8081
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: calibre-by-roket
x-casaos:
  main: calibre
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.calibre/assets/icon.png
  title:
    en_US: Calibre (LinuxServer.io)
  id: by-roket.linuxserver.calibre
  port_map: '8080'
  version: 9.14.0
  index: /
