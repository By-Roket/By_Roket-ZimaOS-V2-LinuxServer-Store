name: linuxserver-thelounge
services:
  app:
    image: linuxserver/thelounge:4.5.2@sha256:b266f455a1efc04606fe11caef8390232c05bc4c253afae51384e26620819c73
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 9000
        published: 9000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/thelounge/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.thelounge/assets/icon.png
  title:
    en_US: Thelounge
  port_map: '9000'
  id: by-roket.linuxserver.thelounge
  version: 4.5.2
  index: /
