name: linuxserver-thelounge
services:
  thelounge:
    image: linuxserver/thelounge:4.5.2@sha256:46038b2e8def807ec2fa98e2211cc13de7c4c141331d548704ef0a9c1f271fcb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 9000
        published: 9000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: thelounge-by-roket
