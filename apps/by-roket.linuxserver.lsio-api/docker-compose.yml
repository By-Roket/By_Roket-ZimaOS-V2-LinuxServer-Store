name: linuxserver-lsio-api
services:
  lsio-api:
    image: linuxserver/lsio-api:version-9eda67ec
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: lsio-api-by-roket
x-casaos:
  main: lsio-api
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.lsio-api/assets/icon.png
  title:
    en_US: Lsio api
  port_map: '80'
  id: by-roket.linuxserver.lsio-api
  version: version-9eda67ec
  index: /
