name: linuxserver-davos
services:
  davos:
    image: linuxserver/davos:2.2.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/download
        target: /download
    container_name: davos-by-roket
x-casaos:
  main: davos
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.davos/assets/icon.png
  title:
    en_US: Davos (LinuxServer.io)
  id: by-roket.linuxserver.davos
  port_map: '8080'
  version: 2.2.2
  index: /
