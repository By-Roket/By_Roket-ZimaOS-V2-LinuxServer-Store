name: linuxserver-davos
services:
  davos:
    image: linuxserver/davos:2.2.2@sha256:171a1388ba9167f400e70e97411dd31c738381a4444120c49e1445449ec664f5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/davos/config
        target: /config
      - type: bind
        source: /DATA/AppData/davos/download
        target: /download
x-casaos:
  main: davos
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.davos/assets/icon.png
  title:
    en_US: Davos
  port_map: '8080'
  id: by-roket.linuxserver.davos
  version: 2.2.2
  index: /
