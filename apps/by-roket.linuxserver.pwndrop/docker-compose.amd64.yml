name: linuxserver-pwndrop
services:
  pwndrop:
    image: linuxserver/pwndrop:1.0.1@sha256:c6a17eb389ddb60600761d9ee437ab68d0dca123afba26607c61ba3b3bb85860
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SECRET_PATH: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: pwndrop-by-roket
x-casaos:
  main: pwndrop
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.pwndrop/assets/icon.png
  title:
    en_US: Pwndrop (LinuxServer.io)
  id: by-roket.linuxserver.pwndrop
  port_map: '8080'
  version: 1.0.1
  index: /
