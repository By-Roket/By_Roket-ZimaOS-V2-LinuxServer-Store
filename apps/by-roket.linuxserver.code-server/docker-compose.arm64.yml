name: linuxserver-code-server
services:
  code-server:
    image: linuxserver/code-server:4.136.2@sha256:771578f3f695cd30aff68c5d89a501244fc981855ee77aba36816221d20220f5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PASSWORD: ''
      HASHED_PASSWORD: ''
      SUDO_PASSWORD: ''
      SUDO_PASSWORD_HASH: ''
      PROXY_DOMAIN: ''
      DEFAULT_WORKSPACE: ''
      PWA_APPNAME: ''
    ports:
      - target: 8443
        published: 8443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: code-server-by-roket
x-casaos:
  main: code-server
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.code-server/assets/icon.png
  title:
    en_US: Code server (LinuxServer.io)
  id: by-roket.linuxserver.code-server
  port_map: '8443'
  version: 4.136.2
  index: /
