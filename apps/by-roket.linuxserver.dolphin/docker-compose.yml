name: linuxserver-dolphin
services:
  dolphin:
    image: linuxserver/dolphin:2606a-ls79
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/dolphin/config
        target: /config
x-casaos:
  main: dolphin
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.dolphin/assets/icon.png
  title:
    en_US: Dolphin
  port_map: '3000'
  id: by-roket.linuxserver.dolphin
  version: 2606a-ls79
  index: /
