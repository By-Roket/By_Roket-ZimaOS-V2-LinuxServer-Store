name: linuxserver-dolphin
services:
  dolphin:
    image: linuxserver/dolphin:version-2606a@sha256:1aa276f6a6a5c6419a18ae0bdc4c333bf443f8fc4581b594a007694ef6b560b5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: dolphin-by-roket
x-casaos:
  main: dolphin
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.dolphin/assets/icon.png
  title:
    en_US: Dolphin
  port_map: '3000'
  id: by-roket.linuxserver.dolphin
  version: version-2606a
  index: /
