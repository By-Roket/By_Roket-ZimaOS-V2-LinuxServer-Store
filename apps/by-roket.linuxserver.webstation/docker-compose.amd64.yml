name: linuxserver-webstation
services:
  app:
    image: linuxserver/webstation:0.5.0-romm@sha256:bc75c7d237116306ce3e786763ac1154e43e7ea3e2ecd8311e2114f5c9fe88c2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webstation/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.webstation/assets/icon.png
  title:
    en_US: Webstation
  port_map: '3000'
  id: by-roket.linuxserver.webstation
  version: 0.5.0-romm
  index: /
