name: linuxserver-webstation
services:
  webstation:
    image: linuxserver/webstation:0.8.2-romm@sha256:c7f3808122ea916571ef5d75e553b118a5a8f842d821264cca978e32be9ba3e3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: webstation-by-roket
x-casaos:
  main: webstation
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.webstation/assets/icon.png
  title:
    en_US: Webstation (LinuxServer.io)
  id: by-roket.linuxserver.webstation
  port_map: '3000'
  version: 0.8.2-romm
  index: /
