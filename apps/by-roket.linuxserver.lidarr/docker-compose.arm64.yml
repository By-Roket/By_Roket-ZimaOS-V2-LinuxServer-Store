name: linuxserver-lidarr
services:
  lidarr:
    image: linuxserver/lidarr:3.1.0@sha256:6255a25514349201f66b72dc0a63d511460acfb88a017eed2a98ee42884f2357
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8686
        published: 8686
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/lidarr/config
        target: /config
      - type: bind
        source: /DATA/AppData/lidarr/music
        target: /music
      - type: bind
        source: /DATA/AppData/lidarr/downloads
        target: /downloads
x-casaos:
  main: lidarr
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.lidarr/assets/icon.png
  title:
    en_US: Lidarr
  port_map: '8686'
  id: by-roket.linuxserver.lidarr
  version: 3.1.0
  index: /
