name: linuxserver-lidarr
services:
  lidarr:
    image: linuxserver/lidarr:3.1.0@sha256:6255a25514349201f66b72dc0a63d511460acfb88a017eed2a98ee42884f2357
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8686
        published: 8686
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/music
        target: /music
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
    container_name: lidarr-by-roket
x-casaos:
