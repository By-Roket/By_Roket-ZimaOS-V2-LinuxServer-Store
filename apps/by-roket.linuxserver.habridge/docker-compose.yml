name: linuxserver-habridge
services:
  habridge:
    image: linuxserver/habridge:5.4.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SEC_KEY: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
      - target: 50000
        published: 50000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/habridge/config
        target: /config
x-casaos:
  main: habridge
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.habridge/assets/icon.png
  title:
    en_US: Habridge
  port_map: '8080'
  id: by-roket.linuxserver.habridge
  version: 5.4.1
  index: /
