name: linuxserver-luanti
services:
  luanti:
    image: linuxserver/luanti:5.17.0@sha256:202d53b7d037152012d41cc8969cdac2d54b63260e34906bd43ade4a3c4d1f5f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CLI_ARGS: ''
    ports:
      - target: 30000
        published: 30000
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/.minetest
        target: /config/.minetest
    container_name: luanti-by-roket
x-casaos:
  main: luanti
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.luanti/assets/icon.png
  title:
    en_US: Luanti
  port_map: '30000'
  id: by-roket.linuxserver.luanti
  version: 5.17.0
  index: /
