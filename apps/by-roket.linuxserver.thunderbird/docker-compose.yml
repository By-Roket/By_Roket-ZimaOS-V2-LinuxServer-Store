name: linuxserver-thunderbird
services:
  thunderbird:
    image: linuxserver/thunderbird:1140.13.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/thunderbird/config
        target: /config
x-casaos:
  main: thunderbird
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.thunderbird/assets/icon.png
  title:
    en_US: Thunderbird
  port_map: '3000'
  id: by-roket.linuxserver.thunderbird
  version: 1140.13.0
  index: /
