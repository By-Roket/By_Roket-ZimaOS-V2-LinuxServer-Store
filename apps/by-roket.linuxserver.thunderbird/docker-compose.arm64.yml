name: linuxserver-thunderbird
services:
  thunderbird:
    image: linuxserver/thunderbird:1140.16.0@sha256:3a84ee2d82df17340beeb51adbc95e8d2e8e544985fb46db28ddef0b5d1b5a8a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: thunderbird-by-roket
