name: linuxserver-lazylibrarian
services:
  lazylibrarian:
    image: linuxserver/lazylibrarian:version-2dac7153@sha256:1eb3c9df7be0f53c211e6d1d5d59269aa180e930a74dc7be829137a5cd4a3c9c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DOCKER_MODS: ''
    ports:
      - target: 5299
        published: 5299
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
      - type: bind
        source: /DATA/AppData/$AppID/books
        target: /books
    container_name: lazylibrarian-by-roket
x-casaos:
  main: lazylibrarian
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.lazylibrarian/assets/icon.png
  title:
    en_US: Lazylibrarian (LinuxServer.io)
  id: by-roket.linuxserver.lazylibrarian
  port_map: '5299'
  version: version-2dac7153
  index: /
