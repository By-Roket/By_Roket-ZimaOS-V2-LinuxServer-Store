name: linuxserver-lazylibrarian
services:
  lazylibrarian:
    image: linuxserver/lazylibrarian:version-ec319ee1@sha256:43efd3bb3a3f56d6077a2f083784dd3036d9c7f53f6d972c1a363b89900915e7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DOCKER_MODS: ''
    ports:
      - target: 5299
        published: 5299
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
      - type: bind
        source: /DATA/AppData/$AppID/books
        target: /books
    container_name: lazylibrarian-by-roket
