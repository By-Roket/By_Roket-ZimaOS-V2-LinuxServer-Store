name: linuxserver-lazylibrarian
services:
  lazylibrarian:
    image: linuxserver/lazylibrarian:version-781698e6@sha256:4dfb4a1ddca111277fe31f848c32d8bd54d05a97d80c89d65f0ff9bedc427107
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DOCKER_MODS: ''
    ports:
      - target: 5299
        published: 5299
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
      - type: bind
        source: /DATA/AppData/$AppID/books
        target: /books
    container_name: lazylibrarian-by-roket
