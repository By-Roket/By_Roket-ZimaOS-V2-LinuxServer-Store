name: linuxserver-lazylibrarian
services:
  lazylibrarian:
    image: linuxserver/lazylibrarian:version-31bc5e56@sha256:641a78a56f2445a529cf621de9b9a9afd1b3379b41f720579362a517b87f8c68
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DOCKER_MODS: ''
    ports:
      - target: 5299
        published: 5299
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
      - type: bind
        source: /DATA/AppData/$AppID/books
        target: /books
    container_name: lazylibrarian-by-roket
