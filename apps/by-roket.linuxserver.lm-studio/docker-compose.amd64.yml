name: linuxserver-lm-studio
services:
  lm-studio:
    image: linuxserver/lm-studio:2026-08-21-ls22@sha256:85597515869076737941f3c6ac42c474b64af3e1a8802df6affe047ec4d7deeb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/lm-studio/config
        target: /config
x-casaos:
  main: lm-studio
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.lm-studio/assets/icon.png
  title:
    en_US: Lm studio
  port_map: '3000'
  id: by-roket.linuxserver.lm-studio
  version: 2026-08-21-ls22
  index: /
