name: linuxserver-lm-studio
services:
  lm-studio:
    image: linuxserver/lm-studio:version-2026-09-12@sha256:61ac1451e00ae5f41d0af89b8e2df3e2555582e44ddad4e3170e76c481dbb913
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: lm-studio-by-roket
x-casaos:
  main: lm-studio
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.lm-studio/assets/icon.png
  title:
    en_US: Lm studio (LinuxServer.io)
  id: by-roket.linuxserver.lm-studio
  port_map: '3000'
  version: version-2026-09-12
  index: /
