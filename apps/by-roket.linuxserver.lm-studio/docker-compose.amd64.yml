name: linuxserver-lm-studio
services:
  lm-studio:
    image: linuxserver/lm-studio:version-2026-09-11@sha256:5d8b7de8821149eaf695fb1efcc41e4e4ae9f66d8a4ce7ef90fe6590854a3c6f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: lm-studio-by-roket
x-casaos:
  main: lm-studio
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.lm-studio/assets/icon.png
  title:
    en_US: Lm studio (LinuxServer.io)
  id: by-roket.linuxserver.lm-studio
  port_map: '3000'
  version: version-2026-09-11
  index: /
