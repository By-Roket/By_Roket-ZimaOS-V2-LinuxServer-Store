name: linuxserver-steam
services:
  steam:
    image: linuxserver/steam:version-0779c5e2@sha256:f7d15fe19689e9872bfa4612d33ed42e0cc1d4c11539df4ae490514dc1f1f6c3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: steam-by-roket
x-casaos:
  main: steam
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.steam/assets/icon.png
  title:
    en_US: Steam (LinuxServer.io)
  id: by-roket.linuxserver.steam
  port_map: '3000'
  version: version-0779c5e2
  index: /
