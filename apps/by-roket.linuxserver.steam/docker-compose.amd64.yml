name: linuxserver-steam
services:
  steam:
    image: linuxserver/steam:version-abe938da@sha256:e2d2b58ba87d3bf538c9b0f72d59bc586cf72186c7afded6591ae7464e1ba04a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/steam/config
        target: /config
x-casaos:
  main: steam
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.steam/assets/icon.png
  title:
    en_US: Steam
  port_map: '3000'
  id: by-roket.linuxserver.steam
  version: version-abe938da
  index: /
