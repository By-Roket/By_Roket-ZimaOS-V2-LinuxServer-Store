name: linuxserver-qemu-static
services:
  qemu-static:
    image: linuxserver/qemu-static:10.0.2@sha256:dbb800b6f1562cd34ec0edadd659d09057677017bf00bcb62e92f773dc051678
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: qemu-static-by-roket
x-casaos:
  main: qemu-static
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.qemu-static/assets/icon.png
  title:
    en_US: Qemu static (LinuxServer.io)
  id: by-roket.linuxserver.qemu-static
  port_map: '80'
  version: 10.0.2
  index: /
