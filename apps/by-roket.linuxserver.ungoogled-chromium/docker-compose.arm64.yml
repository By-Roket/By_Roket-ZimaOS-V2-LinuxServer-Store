name: linuxserver-ungoogled-chromium
services:
  ungoogled-chromium:
    image: linuxserver/ungoogled-chromium:151.0.7922@sha256:fb00d9c34b93d0d7dd1b70dc086440f152c6100a14f460139d1ce735e5a04c05
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CHROME_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: ungoogled-chromium-by-roket
x-casaos:
  main: ungoogled-chromium
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.ungoogled-chromium/assets/icon.png
  title:
    en_US: Ungoogled chromium
  port_map: '3000'
  id: by-roket.linuxserver.ungoogled-chromium
  version: 151.0.7922
  index: /
