name: linuxserver-radarr
services:
  radarr:
    image: linuxserver/radarr:6.4.4@sha256:e7267965d87712e7c5f45ede40843bf25fd1dd39b151ea67f401addce441d974
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 7878
        published: 7878
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/movies
        target: /movies
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
    container_name: radarr-by-roket
x-casaos:
