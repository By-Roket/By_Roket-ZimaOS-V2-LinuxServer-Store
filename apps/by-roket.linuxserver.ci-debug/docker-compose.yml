name: linuxserver-ci-debug
services:
  ci-debug:
    image: linuxserver/ci-debug:933e2702-ls1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ci-debug/config
        target: /config
x-casaos:
  main: ci-debug
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.ci-debug/assets/icon.png
  title:
    en_US: Ci debug
  port_map: '80'
  id: by-roket.linuxserver.ci-debug
  version: 933e2702-ls1
  index: /
