name: linuxserver-winegui
services:
  winegui:
    image: linuxserver/winegui:4.3.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/winegui/config
        target: /config
x-casaos:
  main: winegui
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.winegui/assets/icon.png
  title:
    en_US: Winegui
  port_map: '3000'
  id: by-roket.linuxserver.winegui
  version: 4.3.0
  index: /
