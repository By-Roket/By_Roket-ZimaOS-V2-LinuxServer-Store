name: linuxserver-brave
services:
  brave:
    image: linuxserver/brave:1.94.119@sha256:1e0a36fc57475122f090f77a6e65c0304d186dfce3e880c09ab1d1b8b300cd37
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: brave-by-roket
x-casaos:
  main: brave
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.brave/assets/icon.png
  title:
    en_US: Brave (LinuxServer.io)
  id: by-roket.linuxserver.brave
  port_map: '3000'
  version: 1.94.119
  index: /
