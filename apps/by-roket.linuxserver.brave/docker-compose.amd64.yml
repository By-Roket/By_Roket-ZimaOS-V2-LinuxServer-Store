name: linuxserver-brave
services:
  brave:
    image: linuxserver/brave:1.94.121@sha256:1928fa577e05f2d126e7d63384026f8fe041f2593a0cc6987429bc1ec9f05224
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: brave-by-roket
x-casaos:
  main: brave
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.brave/assets/icon.png
  title:
    en_US: Brave (LinuxServer.io)
  id: by-roket.linuxserver.brave
  port_map: '3000'
  version: 1.94.121
  index: /
