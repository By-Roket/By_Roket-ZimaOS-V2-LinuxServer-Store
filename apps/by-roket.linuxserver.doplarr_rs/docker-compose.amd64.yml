    image: linuxserver/doplarr_rs:4.6.0@sha256:16ce821f92665bfc177e4fc32a517b9cfa407f5c5475536360b0955a69b63130
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: doplarr_rs-by-roket
