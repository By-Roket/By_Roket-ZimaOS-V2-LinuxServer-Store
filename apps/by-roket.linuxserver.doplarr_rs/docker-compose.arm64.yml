  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.doplarr_rs/assets/icon.png
  title:
    en_US: Doplarr_rs
  port_map: '80'
  id: by-roket.linuxserver.doplarr_rs
  version: 4.6.0
  index: /
