name: linuxserver-doplarr_rs
services:
  doplarr_rs:
    image: linuxserver/doplarr_rs:4.6.0@sha256:6a2fecfeb7b5d97dedcb065852c96f2b8a5f43e53e9c2a509b21f577a3765bdc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: doplarr_rs-by-roket
x-casaos:
