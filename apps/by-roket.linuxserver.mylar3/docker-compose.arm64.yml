name: linuxserver-mylar3
services:
  mylar3:
    image: linuxserver/mylar3:0.11.0@sha256:ae836ec3383e814ea30b33042317b262e0c2c5d34002f5c250b12dbe606ee892
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8090
        published: 8090
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/comics
        target: /comics
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
    container_name: mylar3-by-roket
x-casaos:
