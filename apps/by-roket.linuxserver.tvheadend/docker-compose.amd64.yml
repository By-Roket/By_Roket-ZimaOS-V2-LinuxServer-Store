name: linuxserver-tvheadend
services:
  tvheadend:
    image: linuxserver/tvheadend:version-5ce3ff63@sha256:3e705a3aa59f559cc3e75dbc755b8262ae58bdbefe33febdc41fcb6d6d9cc74f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      RUN_OPTS: ''
    ports:
      - target: 9981
        published: 9981
        protocol: tcp
      - target: 9982
        published: 9982
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/recordings
        target: /recordings
    devices:
      - /dev/dri:/dev/dri
      - /dev/dvb:/dev/dvb
    container_name: tvheadend-by-roket
x-casaos:
  main: tvheadend
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.tvheadend/assets/icon.png
  title:
    en_US: Tvheadend (LinuxServer.io)
  id: by-roket.linuxserver.tvheadend
  version: version-5ce3ff63
  index: /
  port_map: '9981'
