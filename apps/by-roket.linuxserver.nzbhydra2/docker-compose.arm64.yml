name: linuxserver-nzbhydra2
services:
  nzbhydra2:
    image: linuxserver/nzbhydra2:8.9.0@sha256:339100e76cd467f6ecd4c9bea5452c0f33bc48797427dc19677d679aba97dd3d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 5076
        published: 5076
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
    container_name: nzbhydra2-by-roket
