name: linuxserver-openvscode-server
services:
  openvscode-server:
    image: linuxserver/openvscode-server:1.109.5@sha256:5114a491ffe77c0ec823bed1fb5bc6c160f4f47b0cbc1e032c806e08c4e4e05a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONNECTION_TOKEN: ''
      CONNECTION_SECRET: ''
      SUDO_PASSWORD: ''
      SUDO_PASSWORD_HASH: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/openvscode-server/config
        target: /config
      - type: bind
        source: /
        target: /casaos
x-casaos:
  main: openvscode-server
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.openvscode-server/assets/icon.png
  title:
    en_US: Openvscode server
  port_map: '3000'
  id: by-roket.linuxserver.openvscode-server
  version: 1.109.5
  index: /
