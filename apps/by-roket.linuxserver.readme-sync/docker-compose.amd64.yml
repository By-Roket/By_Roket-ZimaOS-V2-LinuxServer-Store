name: linuxserver-readme-sync
services:
  readme-sync:
    image: linuxserver/readme-sync:84f2d0c3-ls27@sha256:bf90b9ef51a076687982ce26628684dcd7ed08dff6aa7ca5f54b044fb24e7670
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: readme-sync-by-roket
x-casaos:
  main: readme-sync
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.readme-sync/assets/icon.png
  title:
    en_US: Readme sync
  port_map: '80'
  id: by-roket.linuxserver.readme-sync
  version: 84f2d0c3-ls27
  index: /
