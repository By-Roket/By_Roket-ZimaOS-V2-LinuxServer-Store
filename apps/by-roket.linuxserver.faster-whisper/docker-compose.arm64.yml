name: linuxserver-faster-whisper
services:
  faster-whisper:
    image: linuxserver/faster-whisper:3.8.1@sha256:08dca98cc664dd5ccbd6e3f07b8d0937b6a17e1bd7d14a512a43813973ebf79e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DEBUG: ''
      LOCAL_ONLY: ''
      WHISPER_BEAM: ''
      WHISPER_LANG: ''
      WHISPER_MODEL: ''
    ports:
      - target: 10300
        published: 10300
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: faster-whisper-by-roket
x-casaos:
  main: faster-whisper
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.faster-whisper/assets/icon.png
  title:
    en_US: Faster whisper (LinuxServer.io)
  id: by-roket.linuxserver.faster-whisper
  port_map: '10300'
  version: 3.8.1
  index: /
