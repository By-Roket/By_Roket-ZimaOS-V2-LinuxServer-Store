name: linuxserver-faster-whisper
services:
  app:
    image: linuxserver/faster-whisper:3.6.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DEBUG: ''
      LOCAL_ONLY: ''
      WHISPER_BEAM: ''
      WHISPER_LANG: ''
      WHISPER_MODEL: ''
    ports:
      - target: 10300
        published: 10300
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/faster-whisper/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.faster-whisper/assets/icon.png
  title:
    en_US: Faster whisper
  port_map: '10300'
  id: by-roket.linuxserver.faster-whisper
  version: 3.6.0
  index: /
