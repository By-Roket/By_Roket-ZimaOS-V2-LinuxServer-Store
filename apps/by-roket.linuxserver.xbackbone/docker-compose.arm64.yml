name: linuxserver-xbackbone
services:
  app:
    image: linuxserver/xbackbone:3.8.2@sha256:cf5f4e2b5be0242ad4463dff158e32e685b34bc3ca53048bf2569d650269ce18
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/xbackbone/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.xbackbone/assets/icon.png
  title:
    en_US: Xbackbone
  port_map: '80'
  id: by-roket.linuxserver.xbackbone
  version: 3.8.2
  index: /
