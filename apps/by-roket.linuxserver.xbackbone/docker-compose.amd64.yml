name: linuxserver-xbackbone
services:
  xbackbone:
    image: linuxserver/xbackbone:3.8.2@sha256:d8a29c0f2463a9b85fc9d350b4477fc4024a810ee781c5dac5d7bc16bef73488
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: xbackbone-by-roket
x-casaos:
  main: xbackbone
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.xbackbone/assets/icon.png
  title:
    en_US: Xbackbone (LinuxServer.io)
  id: by-roket.linuxserver.xbackbone
  port_map: '80'
  version: 3.8.2
  index: /
