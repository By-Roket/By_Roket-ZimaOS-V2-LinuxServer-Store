name: linuxserver-handbrake
services:
  handbrake:
    image: linuxserver/handbrake:1.11.2@sha256:089c39d11b93ab7e47754790f0e8e9f4cff9cd304d12b85573e5e9481cad110d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/handbrake/config
        target: /config
x-casaos:
  main: handbrake
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.handbrake/assets/icon.png
  title:
    en_US: Handbrake
  port_map: '3000'
  id: by-roket.linuxserver.handbrake
  version: 1.11.2
  index: /
