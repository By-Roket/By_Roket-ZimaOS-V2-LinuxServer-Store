name: linuxserver-jackett
services:
  jackett:
    image: linuxserver/jackett:0.24.2541@sha256:16a7cc724c18a4ebb23a08c1a93de8d79fc8d6f338fbfc143dc7230880c51204
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      AUTO_UPDATE: ''
      RUN_OPTS: ''
    ports:
      - target: 9117
        published: 9117
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
    container_name: jackett-by-roket
x-casaos:
  main: jackett
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.jackett/assets/icon.png
  title:
    en_US: Jackett (LinuxServer.io)
  id: by-roket.linuxserver.jackett
  port_map: '9117'
  version: 0.24.2541
  index: /
