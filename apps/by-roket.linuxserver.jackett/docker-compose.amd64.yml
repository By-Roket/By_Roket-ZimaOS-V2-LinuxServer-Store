name: linuxserver-jackett
services:
  jackett:
    image: linuxserver/jackett:0.24.2481@sha256:85b00cc30c79a00f523e54a73c18b8aebebaccd24e8522caa47c138ee1a3446f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      AUTO_UPDATE: ''
      RUN_OPTS: ''
    ports:
      - target: 9117
        published: 9117
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
    container_name: jackett-by-roket
x-casaos:
  main: jackett
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.jackett/assets/icon.png
  title:
    en_US: Jackett
  port_map: '9117'
  id: by-roket.linuxserver.jackett
  version: 0.24.2481
  index: /
