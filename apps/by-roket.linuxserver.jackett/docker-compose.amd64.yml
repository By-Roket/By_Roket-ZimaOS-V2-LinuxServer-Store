name: linuxserver-jackett
services:
  jackett:
    image: linuxserver/jackett:0.24.2486@sha256:5890f6445e357852c9e8e4a22795060753c0e2ad74fc428b8e22ac1ab1cb018b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      AUTO_UPDATE: ''
      RUN_OPTS: ''
    ports:
      - target: 9117
        published: 9117
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
    container_name: jackett-by-roket
x-casaos:
  main: jackett
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.jackett/assets/icon.png
  title:
    en_US: Jackett
  port_map: '9117'
  id: by-roket.linuxserver.jackett
  version: 0.24.2486
  index: /
