name: linuxserver-jackett
services:
  jackett:
    image: linuxserver/jackett:0.24.2551@sha256:73456f23cf048daffba61e0c5b782512b265bc948094de0f0173d020ca28ec95
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      AUTO_UPDATE: ''
      RUN_OPTS: ''
    ports:
      - target: 9117
        published: 9117
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
    container_name: jackett-by-roket
x-casaos:
  main: jackett
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.jackett/assets/icon.png
  title:
    en_US: Jackett (LinuxServer.io)
  id: by-roket.linuxserver.jackett
  port_map: '9117'
  version: 0.24.2551
  index: /
