name: linuxserver-jackett
services:
  jackett:
    image: linuxserver/jackett:0.24.2520@sha256:ed2f6b0a6228c825167bd530e4e04f1ad33c6ab2927d4906249c6669644b2b31
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      AUTO_UPDATE: ''
      RUN_OPTS: ''
    ports:
      - target: 9117
        published: 9117
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
    container_name: jackett-by-roket
x-casaos:
  main: jackett
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.jackett/assets/icon.png
  title:
    en_US: Jackett (LinuxServer.io)
  id: by-roket.linuxserver.jackett
  port_map: '9117'
  version: 0.24.2520
  index: /
