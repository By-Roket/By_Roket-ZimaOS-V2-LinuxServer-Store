name: linuxserver-jackett
services:
  jackett:
    image: linuxserver/jackett:0.24.2440@sha256:3df01afd8651a648acaab0827798f6dc961490ec8c249bf2c66668335587afbc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      AUTO_UPDATE: ''
      RUN_OPTS: ''
    ports:
      - target: 9117
        published: 9117
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/jackett/config
        target: /config
      - type: bind
        source: /DATA/AppData/jackett/downloads
        target: /downloads
x-casaos:
  main: jackett
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.jackett/assets/icon.png
  title:
    en_US: Jackett
  port_map: '9117'
  id: by-roket.linuxserver.jackett
  version: 0.24.2440
  index: /
