name: linuxserver-minetest
services:
  minetest:
    image: linuxserver/minetest:5.10.0@sha256:462b94bececc3788866d980953ee393e27afb06b1fc5a3eebfbb7498a3fa8f0c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CLI_ARGS: ''
    ports:
      - target: 30000
        published: 30000
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/minetest/config/.minetest
        target: /config/.minetest
x-casaos:
  main: minetest
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.minetest/assets/icon.png
  title:
    en_US: Minetest
  id: by-roket.linuxserver.minetest
  version: 5.10.0
  index: /
  port_map: ''
