name: linuxserver-minetest
services:
  minetest:
    image: linuxserver/minetest:5.10.0@sha256:85bb5acc2b000b1a86fb7ec427e5ab8c221ec2d62f6c9c858d01bc886f1a9ab1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CLI_ARGS: ''
    ports:
      - target: 30000
        published: 30000
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/.minetest
        target: /config/.minetest
    container_name: minetest-by-roket
