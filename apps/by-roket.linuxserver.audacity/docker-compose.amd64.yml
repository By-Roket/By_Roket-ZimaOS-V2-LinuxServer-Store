name: linuxserver-audacity
services:
  audacity:
    image: linuxserver/audacity:3.7.9@sha256:bbd1bb0264ed2ca4cddfb76a177ced2d1f9cbf78f67aff107d6903e8b8ed896b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: audacity-by-roket
x-casaos:
  main: audacity
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.audacity/assets/icon.png
  title:
    en_US: Audacity (LinuxServer.io)
  id: by-roket.linuxserver.audacity
  port_map: '3000'
  version: 3.7.9
  index: /
