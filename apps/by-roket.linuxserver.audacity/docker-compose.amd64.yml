name: linuxserver-audacity
services:
  app:
    image: linuxserver/audacity:3.7.8@sha256:a79494c2954a73637b21fc72697a0a9d7e299d6b6b079623b2a352b33824f20b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/audacity/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.audacity/assets/icon.png
  title:
    en_US: Audacity
  port_map: '3000'
  id: by-roket.linuxserver.audacity
  version: 3.7.8
  index: /
