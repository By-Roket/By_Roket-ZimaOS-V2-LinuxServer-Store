name: linuxserver-audacity
services:
  audacity:
    image: linuxserver/audacity:3.7.8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: audacity-by-roket
x-casaos:
  main: audacity
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.audacity/assets/icon.png
  title:
    en_US: Audacity
  port_map: '3000'
  id: by-roket.linuxserver.audacity
  version: 3.7.8
  index: /
