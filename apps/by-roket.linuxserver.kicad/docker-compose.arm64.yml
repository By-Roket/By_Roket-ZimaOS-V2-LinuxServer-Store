name: linuxserver-kicad
services:
  kicad:
    image: linuxserver/kicad:10.0.3@sha256:3f8eefbb3771c5dbd527fafd3386f48537fdbe7b61c7b01dec38e3229252a6a8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: kicad-by-roket
x-casaos:
