name: linuxserver-limnoria
services:
  limnoria:
    image: linuxserver/limnoria:2026.5.8@sha256:eaead8e684c3768d1b1a5441b796b89d88d319dc0fd8a5e82fa5c15a233c58ed
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: limnoria-by-roket
x-casaos:
  main: limnoria
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.limnoria/assets/icon.png
  title:
    en_US: Limnoria (LinuxServer.io)
  id: by-roket.linuxserver.limnoria
  port_map: '8080'
  version: 2026.5.8
  index: /
