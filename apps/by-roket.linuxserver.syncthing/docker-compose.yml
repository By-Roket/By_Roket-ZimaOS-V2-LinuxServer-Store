name: linuxserver-syncthing
services:
  syncthing:
    image: linuxserver/syncthing:2.1.5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8384
        published: 8384
        protocol: tcp
      - target: 22000
        published: 22000
        protocol: tcp
      - target: 22000
        published: 22000
        protocol: udp
      - target: 21027
        published: 21027
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/data1
        target: /data1
      - type: bind
        source: /DATA/AppData/$AppID/data2
        target: /data2
    container_name: syncthing-by-roket
