name: linuxserver-citron
services:
  citron:
    image: linuxserver/citron:2026.02.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /srv/lsio/citron/config
        target: /config
x-casaos:
  main: citron
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.citron/assets/icon.png
  title:
    en_US: Citron
  id: by-roket.linuxserver.citron
  version: 2026.02.1
  index: /
  port_map: '3000'
