name: linuxserver-emulatorjs
services:
  emulatorjs:
    image: linuxserver/emulatorjs:1.9.2@sha256:81db557b263e32e57e1df08b786f1fec64f1684799125ec05d212e6450601eb3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SUBFOLDER: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 80
        published: 80
        protocol: tcp
      - target: 4001
        published: 4001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    container_name: emulatorjs-by-roket
x-casaos:
  main: emulatorjs
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.emulatorjs/assets/icon.png
