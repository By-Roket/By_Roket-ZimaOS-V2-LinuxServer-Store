name: linuxserver-projectsend
services:
  projectsend:
    image: linuxserver/projectsend:version-r2098@sha256:34086f72ff944996de584a54ffb40c8be2c9f221af5d0705fd941737d2e5dc6a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    container_name: projectsend-by-roket
