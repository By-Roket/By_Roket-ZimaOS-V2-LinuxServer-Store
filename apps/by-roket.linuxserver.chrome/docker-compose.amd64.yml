name: linuxserver-chrome
services:
  chrome:
    image: linuxserver/chrome:152.0.7977@sha256:e8a4499c4d45a76945e892e0cbc598926e60b09ee9cb176f772ed089ff39428b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CHROME_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: chrome-by-roket
x-casaos:
  main: chrome
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.chrome/assets/icon.png
  title:
    en_US: Chrome
  port_map: '3000'
  id: by-roket.linuxserver.chrome
  version: 152.0.7977
  index: /
