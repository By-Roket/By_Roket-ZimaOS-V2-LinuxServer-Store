name: linuxserver-chrome
services:
  chrome:
    image: linuxserver/chrome:152.0.7977@sha256:585969a2eadd6a5b7bf9ff3b07ab11e124a386c40f0a2f163ff529ec29e90910
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CHROME_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: chrome-by-roket
x-casaos:
  main: chrome
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.chrome/assets/icon.png
  title:
    en_US: Chrome (LinuxServer.io)
  id: by-roket.linuxserver.chrome
  port_map: '3000'
  version: 152.0.7977
  index: /
