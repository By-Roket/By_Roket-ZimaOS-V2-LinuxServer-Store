name: linuxserver-chrome
services:
  chrome:
    image: linuxserver/chrome:151.0.7922@sha256:a5187f15eb38a6ac4667f48b3c002de293170a530537cc1ed602b9d59c43192e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CHROME_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: chrome-by-roket
x-casaos:
  main: chrome
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.chrome/assets/icon.png
  title:
    en_US: Chrome
  port_map: '3000'
  id: by-roket.linuxserver.chrome
  version: 151.0.7922
  index: /
