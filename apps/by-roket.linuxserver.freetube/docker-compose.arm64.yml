name: linuxserver-freetube
services:
  freetube:
    image: linuxserver/freetube:version-190523148@sha256:d7b2411e61c5173bd3f4fbf741e7fcdb4bb714210ee3b2c0469da4f562250474
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: freetube-by-roket
x-casaos:
  main: freetube
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.freetube/assets/icon.png
  title:
    en_US: Freetube
  id: by-roket.linuxserver.freetube
  version: version-190523148
  index: /
  port_map: '3000'
