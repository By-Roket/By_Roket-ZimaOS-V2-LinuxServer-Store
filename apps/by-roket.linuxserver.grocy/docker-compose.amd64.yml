name: linuxserver-grocy
services:
  grocy:
    image: linuxserver/grocy:4.7.1@sha256:d618bdb10eef88c691b8aa20d254d045c4f2091e705bb7736fe7fb5010c87f19
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 9283
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: grocy-by-roket
