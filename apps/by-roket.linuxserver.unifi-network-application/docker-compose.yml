name: linuxserver-unifi-network-application
services:
  unifi-network-application:
    image: linuxserver/unifi-network-application:10.6.101
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MONGO_USER: ''
      MONGO_PASS: ''
      MONGO_HOST: ''
      MONGO_PORT: ''
      MONGO_DBNAME: ''
      MONGO_AUTHSOURCE: ''
      MEM_LIMIT: ''
      MEM_STARTUP: ''
      MONGO_TLS: ''
    ports:
      - target: 8443
        published: 8443
        protocol: tcp
      - target: 3478
        published: 3478
        protocol: udp
      - target: 10001
        published: 10001
        protocol: udp
      - target: 8080
        published: 8080
        protocol: tcp
      - target: 1900
        published: 1900
        protocol: udp
      - target: 8843
        published: 8843
        protocol: tcp
      - target: 8880
        published: 8880
        protocol: tcp
      - target: 6789
        published: 6789
        protocol: tcp
      - target: 5514
        published: 5514
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: unifi-network-application-by-roket
x-casaos:
  main: unifi-network-application
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.unifi-network-application/assets/icon.png
  title:
    en_US: Unifi network-application (LinuxServer.io)
  id: by-roket.linuxserver.unifi-network-application
  port_map: '8080'
  version: 10.6.101
  index: /
