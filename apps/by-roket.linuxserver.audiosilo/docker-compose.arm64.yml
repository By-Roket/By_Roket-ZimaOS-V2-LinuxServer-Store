name: linuxserver-audiosilo
services:
  audiosilo:
    image: linuxserver/audiosilo:2.5.1@sha256:5ba1a88f71a67eac07189febcfa40708d2ba6f358ecdbdc89a38962bcaf4ea42
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/audiobooks:ro
        target: /audiobooks:ro
    container_name: audiosilo-by-roket
x-casaos:
  main: audiosilo
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.audiosilo/assets/icon.png
  title:
    en_US: Audiosilo (LinuxServer.io)
  id: by-roket.linuxserver.audiosilo
  port_map: '8080'
  version: 2.5.1
  index: /
