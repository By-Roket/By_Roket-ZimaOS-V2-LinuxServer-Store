name: linuxserver-audiosilo
services:
  audiosilo:
    image: linuxserver/audiosilo:2.3.1@sha256:e7dbe112ebcb3afbdee26f8bd036803c41fc88ee9ddc584e3b518ab77a01498c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/audiobooks:ro
        target: /audiobooks:ro
    container_name: audiosilo-by-roket
x-casaos:
  main: audiosilo
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.audiosilo/assets/icon.png
  title:
    en_US: Audiosilo (LinuxServer.io)
  id: by-roket.linuxserver.audiosilo
  port_map: '8080'
  version: 2.3.1
  index: /
