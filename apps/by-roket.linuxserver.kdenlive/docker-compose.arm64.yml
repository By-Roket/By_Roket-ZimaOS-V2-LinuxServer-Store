name: linuxserver-kdenlive
services:
  kdenlive:
    image: linuxserver/kdenlive:26.08.0@sha256:5c7f240e33c6c1c9ded1bf23a349c85ab25ae42a19b9bf9ba46b92a71db3e7b1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/kdenlive/config
        target: /config
x-casaos:
  main: kdenlive
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.kdenlive/assets/icon.png
  title:
    en_US: Kdenlive
  port_map: '3000'
  id: by-roket.linuxserver.kdenlive
  version: 26.08.0
  index: /
