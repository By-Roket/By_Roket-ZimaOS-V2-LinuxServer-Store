name: linuxserver-kdenlive
services:
  app:
    image: linuxserver/kdenlive:26.08.0@sha256:411e08e1e2717fbec2ae38d5239469a7de7714813576171576eec12d66506333
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/kdenlive/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.kdenlive/assets/icon.png
  title:
    en_US: Kdenlive
  port_map: '3000'
  id: by-roket.linuxserver.kdenlive
  version: 26.08.0
  index: /
