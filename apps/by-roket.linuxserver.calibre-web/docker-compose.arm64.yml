name: linuxserver-calibre-web
services:
  calibre-web:
    image: linuxserver/calibre-web:0.6.27@sha256:77b8ae07e45c1c88859249eeceda8039e9dff0f0f78f82dacf379b568fda94e3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DOCKER_MODS: ''
      OAUTHLIB_RELAX_TOKEN_SCOPE: ''
    ports:
      - target: 8083
        published: 8083
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/books
        target: /books
    container_name: calibre-web-by-roket
