name: linuxserver-calibre-web
services:
  calibre-web:
    image: linuxserver/calibre-web:0.6.27
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DOCKER_MODS: ''
      OAUTHLIB_RELAX_TOKEN_SCOPE: ''
    ports:
      - target: 8083
        published: 8083
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/books
        target: /books
    container_name: calibre-web-by-roket
x-casaos:
  main: calibre-web
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.calibre-web/assets/icon.png
  title:
    en_US: Calibre web
  port_map: '8083'
  id: by-roket.linuxserver.calibre-web
  version: 0.6.27
  index: /
