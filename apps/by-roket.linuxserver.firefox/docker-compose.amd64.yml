name: linuxserver-firefox
services:
  firefox:
    image: linuxserver/firefox:1.2404.1@sha256:6509932ae07501ccb2ec037c8699b06682d8673307a3194331f1b2c59147526f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      FIREFOX_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: firefox-by-roket
x-casaos:
  main: firefox
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.firefox/assets/icon.png
