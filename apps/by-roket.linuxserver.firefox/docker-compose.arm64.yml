name: linuxserver-firefox
services:
  firefox:
    image: linuxserver/firefox:2.2404.1@sha256:9f70afe1dac1a376cfb2b7a6b77accb12ed442bb563f7633e9a515d5902a8b1c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      FIREFOX_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: firefox-by-roket
x-casaos:
  main: firefox
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.firefox/assets/icon.png
  title:
    en_US: Firefox (LinuxServer.io)
  id: by-roket.linuxserver.firefox
  port_map: '3000'
  version: 2.2404.1
  index: /
