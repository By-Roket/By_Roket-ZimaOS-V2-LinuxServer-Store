name: linuxserver-firefox
services:
  firefox:
    image: linuxserver/firefox:1154.0.1@sha256:d1c51e6367a26ba8dead011aa03c3781f5765b6ca968e6526852f49cb9a19d47
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      FIREFOX_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: firefox-by-roket
x-casaos:
  main: firefox
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.firefox/assets/icon.png
  title:
    en_US: Firefox
  port_map: '3000'
  id: by-roket.linuxserver.firefox
  version: 1154.0.1
  index: /
