name: linuxserver-booksonic-air
services:
  booksonic-air:
    image: linuxserver/booksonic-air:2201.1.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONTEXT_PATH: ''
    ports:
      - target: 4040
        published: 4040
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/audiobooks
        target: /audiobooks
      - type: bind
        source: /DATA/AppData/$AppID/podcasts
        target: /podcasts
      - type: bind
        source: /DATA/AppData/$AppID/othermedia
        target: /othermedia
    container_name: booksonic-air-by-roket
x-casaos:
  main: booksonic-air
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.booksonic-air/assets/icon.png
