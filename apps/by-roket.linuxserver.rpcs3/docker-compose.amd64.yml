name: linuxserver-rpcs3
services:
  rpcs3:
    image: linuxserver/rpcs3:version-build-03d03b2bb4440c4065ef8be793ed0bdcf97a3a4f@sha256:fff8e1bf1684c6db03b84090d7c27687bc4b5a9fc8f0d73f406a15b6c7177893
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: rpcs3-by-roket
x-casaos:
  main: rpcs3
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.rpcs3/assets/icon.png
  title:
    en_US: Rpcs3
  port_map: '3000'
  id: by-roket.linuxserver.rpcs3
  version: version-build-03d03b2bb4440c4065ef8be793ed0bdcf97a3a4f
  index: /
