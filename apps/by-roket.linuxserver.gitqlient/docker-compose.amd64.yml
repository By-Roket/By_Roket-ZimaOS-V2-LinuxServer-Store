name: linuxserver-gitqlient
services:
  app:
    image: linuxserver/gitqlient:1.6.3@sha256:deef6f7fbf746d825513a4ad5b270417bbb117cb17e991a4398cdf7efb5e3433
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/gitqlient/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.gitqlient/assets/icon.png
  title:
    en_US: Gitqlient
  port_map: '3000'
  id: by-roket.linuxserver.gitqlient
  version: 1.6.3
  index: /
