name: linuxserver-ldap-auth
services:
  ldap-auth:
    image: linuxserver/ldap-auth:3.4.7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      FERNETKEY: ''
      CERTFILE: ''
      KEYFILE: ''
    ports:
      - target: 8888
        published: 8888
        protocol: tcp
      - target: 9000
        published: 9000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: ldap-auth-by-roket
x-casaos:
  main: ldap-auth
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.ldap-auth/assets/icon.png
  title:
    en_US: Ldap auth
  id: by-roket.linuxserver.ldap-auth
  version: 3.4.7
  index: /
  port_map: '8888'
