name: linuxserver-flexget
services:
  flexget:
    image: linuxserver/flexget:3.20.7@sha256:efb5e6e7adddb3872eae43bbc670c44eb0e22cb15b7fccca006ac5929f83ff20
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      FG_LOG_LEVEL: ''
      FG_LOG_FILE: ''
      FG_CONFIG_FILE: ''
      FG_WEBUI_PASSWORD: ''
    ports:
      - target: 5050
        published: 5050
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    container_name: flexget-by-roket
x-casaos:
  main: flexget
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.flexget/assets/icon.png
  title:
    en_US: Flexget
  port_map: '5050'
  id: by-roket.linuxserver.flexget
  version: 3.20.7
  index: /
