name: linuxserver-flexget
services:
  flexget:
    image: linuxserver/flexget:3.20.14@sha256:94e6fee4c20fb0c90fa0bd0fd5d7839fbc26ca6946132be7bc2519d74801fbd4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      FG_LOG_LEVEL: ''
      FG_LOG_FILE: ''
      FG_CONFIG_FILE: ''
      FG_WEBUI_PASSWORD: ''
    ports:
      - target: 5050
        published: 5050
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    container_name: flexget-by-roket
x-casaos:
  main: flexget
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.flexget/assets/icon.png
  title:
    en_US: Flexget (LinuxServer.io)
  id: by-roket.linuxserver.flexget
  port_map: '5050'
  version: 3.20.14
  index: /
