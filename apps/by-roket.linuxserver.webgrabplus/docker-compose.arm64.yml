name: linuxserver-webgrabplus
services:
  webgrabplus:
    image: linuxserver/webgrabplus:5.6.1@sha256:a1d0ee4089cffc22c12198a19b3947fead4823c6824e77b821ccd403081cba89
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    container_name: webgrabplus-by-roket
x-casaos:
  main: webgrabplus
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.webgrabplus/assets/icon.jpg
  title:
    en_US: Webgrabplus (LinuxServer.io)
  id: by-roket.linuxserver.webgrabplus
  port_map: '80'
  version: 5.6.1
  index: /
