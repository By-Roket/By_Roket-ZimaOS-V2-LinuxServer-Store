name: linuxserver-heimdall
services:
  heimdall:
    image: linuxserver/heimdall:2.8.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ALLOW_INTERNAL_REQUESTS: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/heimdall/config
        target: /config
x-casaos:
  main: heimdall
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.heimdall/assets/icon.png
  title:
    en_US: Heimdall
  port_map: '80'
  id: by-roket.linuxserver.heimdall
  version: 2.8.2
  index: /
