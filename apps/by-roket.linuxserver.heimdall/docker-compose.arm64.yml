name: linuxserver-heimdall
services:
  heimdall:
    image: linuxserver/heimdall:2.8.3@sha256:ddb3a073999ba89f85434fad8816d329e4a5add4211fb3f6ce2b0e2e0ab7ec14
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ALLOW_INTERNAL_REQUESTS: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: heimdall-by-roket
x-casaos:
  main: heimdall
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.heimdall/assets/icon.png
  title:
    en_US: Heimdall (LinuxServer.io)
  id: by-roket.linuxserver.heimdall
  port_map: '80'
  version: 2.8.3
  index: /
