name: linuxserver-retroarch
services:
  retroarch:
    image: linuxserver/retroarch:1.22.2@sha256:3c6845ab66ec0c1dc65172949c53e301d90742bad65397d0b11d52e22f251b66
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: retroarch-by-roket
