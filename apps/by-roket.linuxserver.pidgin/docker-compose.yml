name: linuxserver-pidgin
services:
  pidgin:
    image: linuxserver/pidgin:2.14.14
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pidgin/config
        target: /config
x-casaos:
  main: pidgin
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.pidgin/assets/icon.png
  title:
    en_US: Pidgin
  port_map: '3000'
  id: by-roket.linuxserver.pidgin
  version: 2.14.14
  index: /
