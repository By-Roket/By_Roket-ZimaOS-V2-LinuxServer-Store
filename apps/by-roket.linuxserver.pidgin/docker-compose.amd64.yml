name: linuxserver-pidgin
services:
  pidgin:
    image: linuxserver/pidgin:2.14.14@sha256:5108dbce3c538b4df6ea830db6af3c590400df0b8d4fdaad4c2d925cb32be21b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: pidgin-by-roket
x-casaos:
