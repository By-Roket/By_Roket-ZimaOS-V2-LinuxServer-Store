name: linuxserver-sealskin
services:
  sealskin:
    image: linuxserver/sealskin:0.3.0@sha256:079f891c3d4027ee707f56bca8c58543f3dc64e2af14c3f95763e4ef1511b577
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HOST_URL: ''
    ports:
      - target: 8443
        published: 8443
        protocol: tcp
      - target: 8000
        published: 8000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/storage
        target: /storage
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    container_name: sealskin-by-roket
x-casaos:
  main: sealskin
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.sealskin/assets/icon.png
  title:
    en_US: Sealskin (LinuxServer.io)
  id: by-roket.linuxserver.sealskin
  port_map: '8000'
  version: 0.3.0
  index: /
