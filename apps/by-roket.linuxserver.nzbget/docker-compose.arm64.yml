name: linuxserver-nzbget
services:
  nzbget:
    image: linuxserver/nzbget:26.2.20260821@sha256:2e53b66b6bf79634b9f4517bcd93b0107c1b9210a27aa9d10b118ee4a8fd2f70
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      NZBGET_USER: ''
      NZBGET_PASS: ''
    ports:
      - target: 6789
        published: 6789
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
    container_name: nzbget-by-roket
x-casaos:
  main: nzbget
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.nzbget/assets/icon.png
  title:
    en_US: Nzbget
  port_map: '6789'
  id: by-roket.linuxserver.nzbget
  version: 26.2.20260821
  index: /
