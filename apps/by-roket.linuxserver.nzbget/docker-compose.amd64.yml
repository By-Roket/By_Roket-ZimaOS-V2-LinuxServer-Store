name: linuxserver-nzbget
services:
  nzbget:
    image: linuxserver/nzbget:26.3.20260911@sha256:c1e0b963aa39df12f4ce3ee3d532c914fe89524f56083b1925f50661c79bda3f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      NZBGET_USER: ''
      NZBGET_PASS: ''
    ports:
      - target: 6789
        published: 6789
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
    container_name: nzbget-by-roket
x-casaos:
  main: nzbget
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.nzbget/assets/icon.png
  title:
    en_US: Nzbget (LinuxServer.io)
  id: by-roket.linuxserver.nzbget
  port_map: '6789'
  version: 26.3.20260911
  index: /
