name: linuxserver-nzbget
services:
  nzbget:
    image: linuxserver/nzbget:26.3.20260918@sha256:d73c80f3c94f58489b01cde02612910cc92cd5dbfce0936643d140a8a5876b41
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      NZBGET_USER: ''
      NZBGET_PASS: ''
    ports:
      - target: 6789
        published: 6789
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
    container_name: nzbget-by-roket
