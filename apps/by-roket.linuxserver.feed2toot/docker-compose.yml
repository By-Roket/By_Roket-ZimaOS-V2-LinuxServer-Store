name: linuxserver-feed2toot
services:
  app:
    image: linuxserver/feed2toot:0.17.20250110
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      FEED_LIMIT: ''
    volumes:
      - type: bind
        source: /DATA/AppData/feed2toot/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.feed2toot/assets/icon.png
  title:
    en_US: Feed2toot
  id: by-roket.linuxserver.feed2toot
  version: 0.17.20250110
  index: /
  port_map: ''
