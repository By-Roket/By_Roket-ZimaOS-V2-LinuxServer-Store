name: linuxserver-helium
services:
  helium:
    image: linuxserver/helium:0.15.6@sha256:ea1c5def038793e351078b4108403c0b256d47f2c70ed34e720c63ecb794e166
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HELIUM_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: helium-by-roket
x-casaos:
  main: helium
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.helium/assets/icon.png
  title:
    en_US: Helium
  port_map: '3000'
  id: by-roket.linuxserver.helium
  version: 0.15.6
  index: /
