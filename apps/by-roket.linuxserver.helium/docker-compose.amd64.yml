name: linuxserver-helium
services:
  helium:
    image: linuxserver/helium:0.15.7@sha256:9562b6b07014b26e1cfbdff4e13a51024a3eb760a987166eee21fc2fd7fea96d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HELIUM_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: helium-by-roket
x-casaos:
  main: helium
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.helium/assets/icon.png
  title:
    en_US: Helium
  port_map: '3000'
  id: by-roket.linuxserver.helium
  version: 0.15.7
  index: /
