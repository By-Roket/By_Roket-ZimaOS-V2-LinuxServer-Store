name: linuxserver-helium
services:
  helium:
    image: linuxserver/helium:0.16.4@sha256:a96b9f9df32bed31dedbba5dccd32d07f5892be8a5539e262cf4c6b2fe6ecb28
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HELIUM_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: helium-by-roket
x-casaos:
  main: helium
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.helium/assets/icon.png
  title:
    en_US: Helium (LinuxServer.io)
  id: by-roket.linuxserver.helium
  port_map: '3000'
  version: 0.16.4
  index: /
