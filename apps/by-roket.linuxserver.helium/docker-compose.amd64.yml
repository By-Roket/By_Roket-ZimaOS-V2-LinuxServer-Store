name: linuxserver-helium
services:
  helium:
    image: linuxserver/helium:0.16.2@sha256:dc15d2102d63f9a0680929320839f707e2be59c53e9dc9452f80d5c407d3eb50
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HELIUM_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: helium-by-roket
x-casaos:
  main: helium
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.helium/assets/icon.png
  title:
    en_US: Helium (LinuxServer.io)
  id: by-roket.linuxserver.helium
  port_map: '3000'
  version: 0.16.2
  index: /
