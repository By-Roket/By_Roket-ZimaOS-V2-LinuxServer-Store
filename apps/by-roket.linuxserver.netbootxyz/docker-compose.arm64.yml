name: linuxserver-netbootxyz
services:
  netbootxyz:
    image: linuxserver/netbootxyz:0.7.3@sha256:400856ceb392acf1ca815f360d3943842d56ae386743a644a294a7f36231079d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MENU_VERSION: ''
      PORT_RANGE: ''
      SUBFOLDER: ''
      NGINX_PORT: ''
      WEB_APP_PORT: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 69
        published: 69
        protocol: udp
      - target: 8080
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/assets
        target: /assets
    container_name: netbootxyz-by-roket
x-casaos:
  main: netbootxyz
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.netbootxyz/assets/icon.png
  title:
    en_US: Netbootxyz
  port_map: '3000'
  id: by-roket.linuxserver.netbootxyz
  version: 0.7.3
  index: /
