name: linuxserver-netbootxyz
services:
  app:
    image: linuxserver/netbootxyz:0.7.3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MENU_VERSION: ''
      PORT_RANGE: ''
      SUBFOLDER: ''
      NGINX_PORT: ''
      WEB_APP_PORT: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 69
        published: 69
        protocol: udp
      - target: 8080
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/netbootxyz/config
        target: /config
      - type: bind
        source: /DATA/AppData/netbootxyz/assets
        target: /assets
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.netbootxyz/assets/icon.png
  title:
    en_US: Netbootxyz
  port_map: '3000'
  id: by-roket.linuxserver.netbootxyz
  version: 0.7.3
  index: /
