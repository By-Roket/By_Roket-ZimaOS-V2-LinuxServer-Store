name: linuxserver-vlc
services:
  vlc:
    image: linuxserver/vlc:3.0.23@sha256:acd0d34cfee8e92858b4849617a7baaa1213cbcf468c5f62bd2c0d22cecbb60c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VLC_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: vlc-by-roket
x-casaos:
