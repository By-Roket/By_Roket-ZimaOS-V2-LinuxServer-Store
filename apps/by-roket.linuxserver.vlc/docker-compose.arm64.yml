name: linuxserver-vlc
services:
  vlc:
    image: linuxserver/vlc:3.0.23@sha256:cd17e0e87e4f06ab00abddd1eb1e0ea24f4ea7195090f684440c3aaa66cbca4b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VLC_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: vlc-by-roket
x-casaos:
  main: vlc
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.vlc/assets/icon.png
  title:
    en_US: Vlc
  port_map: '3000'
  id: by-roket.linuxserver.vlc
  version: 3.0.23
  index: /
