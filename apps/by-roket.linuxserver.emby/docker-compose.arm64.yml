name: linuxserver-emby
services:
  emby:
    image: linuxserver/emby:4.10.0@sha256:9de51b5ed050c12d2ea4166d7bc2f455ab8a3b56f5ca570813fb14aac2fda4bc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8096
        published: 8096
        protocol: tcp
      - target: 8920
        published: 8920
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/data/tvshows
        target: /data/tvshows
      - type: bind
        source: /DATA/AppData/$AppID/data/movies
        target: /data/movies
      - type: bind
        source: /opt/vc/lib
        target: /opt/vc/lib
    container_name: emby-by-roket
x-casaos:
