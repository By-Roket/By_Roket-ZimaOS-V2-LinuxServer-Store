name: linuxserver-nextcloud
services:
  nextcloud:
    image: linuxserver/nextcloud:34.0.4@sha256:c34c882ea6a7b94d61123d95605f0b110d760dd7f76215a2c268f6746c04a082
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 443
        published: 443
        protocol: tcp
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    container_name: nextcloud-by-roket
x-casaos:
  main: nextcloud
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.nextcloud/assets/icon.png
  title:
    en_US: Nextcloud (LinuxServer.io)
  id: by-roket.linuxserver.nextcloud
  port_map: '80'
  version: 34.0.4
  index: /
