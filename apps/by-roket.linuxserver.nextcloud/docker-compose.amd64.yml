name: linuxserver-nextcloud
services:
  nextcloud:
    image: linuxserver/nextcloud:35.0.0@sha256:fde75710e38b234f5f51ff9726efabc98a66f78512d3f0283631618e762af96e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 443
        published: 443
        protocol: tcp
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    container_name: nextcloud-by-roket
x-casaos:
  main: nextcloud
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.nextcloud/assets/icon.png
  title:
    en_US: Nextcloud (LinuxServer.io)
  id: by-roket.linuxserver.nextcloud
  port_map: '80'
  version: 35.0.0
  index: /
