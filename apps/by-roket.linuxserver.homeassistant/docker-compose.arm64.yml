name: linuxserver-homeassistant
services:
  homeassistant:
    image: linuxserver/homeassistant:2026.9.0@sha256:f4152e81fc2c938b11f231804581226cc415734dadd86bcf82ae2bb1585f398d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8123
        published: 8123
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: homeassistant-by-roket
x-casaos:
  main: homeassistant
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.homeassistant/assets/icon.png
  title:
    en_US: Homeassistant (LinuxServer.io)
  id: by-roket.linuxserver.homeassistant
  port_map: '8123'
  version: 2026.9.0
  index: /
