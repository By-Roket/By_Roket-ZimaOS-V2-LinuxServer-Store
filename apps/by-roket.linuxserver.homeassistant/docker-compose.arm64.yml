name: linuxserver-homeassistant
services:
  homeassistant:
    image: linuxserver/homeassistant:2026.9.1@sha256:e6e3ebf92b5ea656d0b3cb81d4a7901f3f4df043fcff3ca13959ee3481fc4b8e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8123
        published: 8123
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: homeassistant-by-roket
x-casaos:
  main: homeassistant
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.homeassistant/assets/icon.png
  title:
    en_US: Homeassistant (LinuxServer.io)
  id: by-roket.linuxserver.homeassistant
  port_map: '8123'
  version: 2026.9.1
  index: /
