name: linuxserver-homeassistant
services:
  homeassistant:
    image: linuxserver/homeassistant:2026.9.2@sha256:c53fce01723719e1b1e69dcc7317b1efc2eb9b9a13f5a2753acc43ffde1060ff
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8123
        published: 8123
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: homeassistant-by-roket
x-casaos:
  main: homeassistant
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.homeassistant/assets/icon.png
  title:
    en_US: Homeassistant (LinuxServer.io)
  id: by-roket.linuxserver.homeassistant
  port_map: '8123'
  version: 2026.9.2
  index: /
