name: linuxserver-libreoffice
services:
  libreoffice:
    image: linuxserver/libreoffice:25.8.7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: libreoffice-by-roket
x-casaos:
  main: libreoffice
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.libreoffice/assets/icon.png
  title:
    en_US: Libreoffice (LinuxServer.io)
  id: by-roket.linuxserver.libreoffice
  port_map: '3000'
  version: 25.8.7
  index: /
