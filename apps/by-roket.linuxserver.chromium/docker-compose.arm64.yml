name: linuxserver-chromium
services:
  chromium:
    image: linuxserver/chromium:version-9fde18d4@sha256:2ae519c5daab9c86e8d3c2146a8e08ad92a11860f23f68e2ff679e9bf1c2e14e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CHROME_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: chromium-by-roket
x-casaos:
  main: chromium
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.chromium/assets/icon.png
  title:
    en_US: Chromium (LinuxServer.io)
  id: by-roket.linuxserver.chromium
  port_map: '3000'
  version: version-9fde18d4
  index: /
