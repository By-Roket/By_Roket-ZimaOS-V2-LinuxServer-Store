name: linuxserver-changedetection-io
services:
  changedetection-io:
    image: linuxserver/changedetection.io:0.60.5@sha256:924b33d2ebddfde4f798dc5866791a70a20791a13ee240cdbe0b232be36dc423
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      BASE_URL: ''
      PLAYWRIGHT_DRIVER_URL: ''
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: changedetection-io-by-roket
x-casaos:
  main: changedetection-io
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.changedetection-io/assets/icon.png
  title:
    en_US: Changedetection. Io (LinuxServer.io)
  id: by-roket.linuxserver.changedetection-io
  port_map: '5000'
  version: 0.60.5
  index: /
