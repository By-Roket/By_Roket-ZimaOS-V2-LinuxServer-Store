name: linuxserver-changedetection-io
services:
  changedetection-io:
    image: linuxserver/changedetection.io:0.60.4@sha256:a03304f37a9c3c783039fa6ed291fe3b9c90886ca38e94e59f6c87da8958b043
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      BASE_URL: ''
      PLAYWRIGHT_DRIVER_URL: ''
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: changedetection-io-by-roket
x-casaos:
  main: changedetection-io
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.changedetection-io/assets/icon.png
  title:
    en_US: Changedetection. Io (LinuxServer.io)
  id: by-roket.linuxserver.changedetection-io
  port_map: '5000'
  version: 0.60.4
  index: /
