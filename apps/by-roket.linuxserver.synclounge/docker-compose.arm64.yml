name: linuxserver-synclounge
services:
  synclounge:
    image: linuxserver/synclounge:5.2.35@sha256:b9a12d7e51a7943ae8fede7828e4380b69370a8f4f3aa6e0d592dbca876c4811
    restart: unless-stopped
    environment:
      AUTH_LIST: ''
    ports:
      - target: 8088
        published: 8088
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: synclounge-by-roket
x-casaos:
  main: synclounge
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.synclounge/assets/icon.png
  title:
    en_US: Synclounge (LinuxServer.io)
  id: by-roket.linuxserver.synclounge
  port_map: '8088'
  version: 5.2.35
  index: /
