name: linuxserver-znc
services:
  znc:
    image: linuxserver/znc:1.10.3@sha256:a1678306b3d2b307253e16abe830c6d41e07315d4c5531ddbd9e295c76a9da89
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 6501
        published: 6501
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: znc-by-roket
x-casaos:
  main: znc
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.znc/assets/icon.png
  title:
    en_US: Znc (LinuxServer.io)
  id: by-roket.linuxserver.znc
  port_map: '6501'
  version: 1.10.3
  index: /
