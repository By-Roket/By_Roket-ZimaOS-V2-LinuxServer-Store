name: linuxserver-zotero
services:
  zotero:
    image: linuxserver/zotero:10.0.1@sha256:cbd0ca2afa3e972fe875e169f4546606cf6f664d5b6b59649bec8138d0b3ff22
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: zotero-by-roket
x-casaos:
  main: zotero
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.zotero/assets/icon.png
  title:
    en_US: Zotero
  port_map: '3000'
  id: by-roket.linuxserver.zotero
  version: 10.0.1
  index: /
