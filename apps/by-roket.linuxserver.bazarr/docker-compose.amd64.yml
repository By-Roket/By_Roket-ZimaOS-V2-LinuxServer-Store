name: linuxserver-bazarr
services:
  bazarr:
    image: linuxserver/bazarr:1.6.0@sha256:e2c621e525d6356f34032cddd7deb3978cbaafc4f537e995efe64b5baf3c7548
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 6767
        published: 6767
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/movies
        target: /movies
      - type: bind
        source: /DATA/AppData/$AppID/tv
        target: /tv
    container_name: bazarr-by-roket
x-casaos:
  main: bazarr
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.bazarr/assets/icon.png
  title:
    en_US: Bazarr
  port_map: '6767'
  id: by-roket.linuxserver.bazarr
  version: 1.6.0
  index: /
