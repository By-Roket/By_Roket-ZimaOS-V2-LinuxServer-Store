name: linuxserver-bazarr
services:
  bazarr:
    image: linuxserver/bazarr:1.6.1@sha256:9cd80bb122363883374389ceb02bbb908981a7762465b4b5d442a0001086383c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 6767
        published: 6767
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/movies
        target: /movies
      - type: bind
        source: /DATA/AppData/$AppID/tv
        target: /tv
    container_name: bazarr-by-roket
x-casaos:
  main: bazarr
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.bazarr/assets/icon.png
  title:
    en_US: Bazarr (LinuxServer.io)
  id: by-roket.linuxserver.bazarr
  port_map: '6767'
  version: 1.6.1
  index: /
