name: linuxserver-flycast
services:
  flycast:
    image: linuxserver/flycast:2.7.20260823@sha256:da176ee96e7604abd27a098aa18a871657d6fbfba20ad039379de8296e4555f4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: flycast-by-roket
x-casaos:
  main: flycast
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.flycast/assets/icon.png
  title:
    en_US: Flycast
  port_map: '3000'
  id: by-roket.linuxserver.flycast
  version: 2.7.20260823
  index: /
