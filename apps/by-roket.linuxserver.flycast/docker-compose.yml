name: linuxserver-flycast
services:
  flycast:
    image: linuxserver/flycast:2.7.20260823
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: flycast-by-roket
x-casaos:
  main: flycast
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.flycast/assets/icon.png
  title:
    en_US: Flycast (LinuxServer.io)
  id: by-roket.linuxserver.flycast
  port_map: '3000'
  version: 2.7.20260823
  index: /
