name: linuxserver-vscodium
services:
  vscodium:
    image: linuxserver/vscodium:1.135.06055@sha256:864054a2e56d57156ee3c5e3d5bb31703dc00407140b3ddcee82f4f879709437
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: vscodium-by-roket
x-casaos:
  main: vscodium
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.vscodium/assets/icon.png
  title:
    en_US: Vscodium (LinuxServer.io)
  id: by-roket.linuxserver.vscodium
  port_map: '3000'
  version: 1.135.06055
  index: /
