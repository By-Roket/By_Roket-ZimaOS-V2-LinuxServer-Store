name: linuxserver-vscodium
services:
  vscodium:
    image: linuxserver/vscodium:1.126.04524
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: vscodium-by-roket
x-casaos:
  main: vscodium
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.vscodium/assets/icon.png
  title:
    en_US: Vscodium
  port_map: '3000'
  id: by-roket.linuxserver.vscodium
  version: 1.126.04524
  index: /
