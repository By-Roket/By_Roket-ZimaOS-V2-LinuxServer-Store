name: linuxserver-mariadb
services:
  mariadb:
    image: linuxserver/mariadb:11.8.8@sha256:9c3f714ffde14968ca0559cce3b757f8c550c4e92bdce29a0e6273be86c32125
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MYSQL_ROOT_PASSWORD: ''
      MYSQL_DATABASE: ''
      MYSQL_USER: ''
      MYSQL_PASSWORD: ''
      REMOTE_SQL: ''
      CLI_OPTS: ''
    ports:
      - target: 3306
        published: 3306
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mariadb/config
        target: /config
x-casaos:
  main: mariadb
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.mariadb/assets/icon.png
  title:
    en_US: Mariadb
  port_map: '3306'
  id: by-roket.linuxserver.mariadb
  version: 11.8.8
  index: /
