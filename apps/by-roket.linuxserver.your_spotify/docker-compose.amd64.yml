name: linuxserver-your_spotify
services:
  your_spotify:
    image: linuxserver/your_spotify:1.20.0@sha256:4b1c5960d846813860e8bfbea0c64da2e432bd0751428f75911c1a18ac42a4ed
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_URL: ''
      SPOTIFY_PUBLIC: ''
      SPOTIFY_SECRET: ''
      SPOTIFY_API_DELAY_MS: ''
      CORS: ''
      MONGO_ENDPOINT: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: your_spotify-by-roket
