name: linuxserver-your_spotify
services:
  app:
    image: linuxserver/your_spotify:1.20.0@sha256:370ed96dc27c2d5013fd75663cde9f0f3d29e6ef4107b6639579fee3da56f96a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_URL: ''
      SPOTIFY_PUBLIC: ''
      SPOTIFY_SECRET: ''
      SPOTIFY_API_DELAY_MS: ''
      CORS: ''
      MONGO_ENDPOINT: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/your_spotify/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.your_spotify/assets/icon.png
  title:
    en_US: Your_spotify
  port_map: '80'
  id: by-roket.linuxserver.your_spotify
  version: 1.20.0
  index: /
