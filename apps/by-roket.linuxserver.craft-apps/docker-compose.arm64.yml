name: linuxserver-craft-apps
services:
  craft-apps:
    image: linuxserver/craft-apps:0.20.2@sha256:cf9212533d82e9fcf8f111915c7cd520c818f35c0fa234c360c07df3e2ecc161
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: craft-apps-by-roket
x-casaos:
  main: craft-apps
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.craft-apps/assets/icon.png
  title:
    en_US: Craft apps (LinuxServer.io)
  id: by-roket.linuxserver.craft-apps
  port_map: '3000'
  version: 0.20.2
  index: /
