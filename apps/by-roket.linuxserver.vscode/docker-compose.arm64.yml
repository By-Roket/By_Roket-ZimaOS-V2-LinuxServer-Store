name: linuxserver-vscode
services:
  vscode:
    image: linuxserver/vscode:1.133.0@sha256:c2a6af443f11d15fc849d8910d317dbc3f7fcc65d21827ad985fc1cc823831a0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscode/config
        target: /config
x-casaos:
  main: vscode
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.vscode/assets/icon.png
  title:
    en_US: Vscode
  port_map: '3000'
  id: by-roket.linuxserver.vscode
  version: 1.133.0
  index: /
