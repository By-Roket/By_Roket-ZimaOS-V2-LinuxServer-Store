name: linuxserver-vscode
services:
  vscode:
    image: linuxserver/vscode:1.136.2@sha256:c4b850c5effb2e4281083fa7db57e3b2cf92f8a4b4210bf2034607bcc2fac5e8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: vscode-by-roket
x-casaos:
  main: vscode
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.vscode/assets/icon.png
  title:
    en_US: Vscode (LinuxServer.io)
  id: by-roket.linuxserver.vscode
  port_map: '3000'
  version: 1.136.2
  index: /
