name: linuxserver-piper
services:
  piper:
    image: linuxserver/piper:2.5.1@sha256:f9ba7b61b4883019d3068843c5ffcc65b4e43d6a856cd99a7f19e6549b759fa0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PIPER_VOICE: ''
      LOCAL_ONLY: ''
      PIPER_LENGTH: ''
      PIPER_NOISE: ''
      PIPER_NOISEW: ''
      PIPER_SPEAKER: ''
      NO_STREAMING: ''
    ports:
      - target: 10200
        published: 10200
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: piper-by-roket
x-casaos:
  main: piper
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.piper/assets/icon.png
  title:
    en_US: Piper (LinuxServer.io)
  id: by-roket.linuxserver.piper
  port_map: '10200'
  version: 2.5.1
  index: /
