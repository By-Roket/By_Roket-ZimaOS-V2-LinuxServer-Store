name: linuxserver-vscodium-web
services:
  vscodium-web:
    image: linuxserver/vscodium-web:1.135.06055@sha256:6bbc044972177c34e4c224a15302e8594e88c529c7fb082d8bf1ff0ffc871638
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONNECTION_TOKEN: ''
      CONNECTION_TOKEN_FILE: ''
      SUDO_PASSWORD: ''
      SUDO_PASSWORD_HASH: ''
      CODE_ARGS: ''
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: vscodium-web-by-roket
x-casaos:
  main: vscodium-web
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.vscodium-web/assets/icon.png
  title:
    en_US: Vscodium web (LinuxServer.io)
  id: by-roket.linuxserver.vscodium-web
  port_map: '8000'
  version: 1.135.06055
  index: /
