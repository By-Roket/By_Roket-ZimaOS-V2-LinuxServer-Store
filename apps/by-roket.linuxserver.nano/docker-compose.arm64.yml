name: linuxserver-nano
services:
  app:
    image: linuxserver/nano:21.2.20220522@sha256:567d37139784eb7cc08b5c945d08d93a98379b93b108f0fd769bed0e7c8adef4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PEER_HOST: ''
      LIVE_GENESIS_PUB: ''
      LIVE_GENESIS_ACCOUNT: ''
      LIVE_GENESIS_WORK: ''
      LIVE_GENESIS_SIG: ''
      CLI_OPTIONS: ''
      LMDB_BOOTSTRAP_URL: ''
    ports:
      - target: 8075
        published: 8075
        protocol: tcp
      - target: 7076
        published: 3000
        protocol: tcp
      - target: 7077
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/nano/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.nano/assets/icon.png
  title:
    en_US: Nano
  id: by-roket.linuxserver.nano
  version: 21.2.20220522
  index: /
  port_map: '8075'
