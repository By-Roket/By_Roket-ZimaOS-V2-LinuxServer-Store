name: linuxserver-rustdesk
services:
  rustdesk:
    image: linuxserver/rustdesk:1.4.9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: rustdesk-by-roket
x-casaos:
  main: rustdesk
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.rustdesk/assets/icon.png
  title:
    en_US: Rustdesk (LinuxServer.io)
  id: by-roket.linuxserver.rustdesk
  port_map: '3000'
  version: 1.4.9
  index: /
