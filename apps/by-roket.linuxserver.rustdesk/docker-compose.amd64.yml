name: linuxserver-rustdesk
services:
  rustdesk:
    image: linuxserver/rustdesk:1.4.9@sha256:38f8983f44d0a9c49d43ddcfd6459ee7ca5885d778050d654b0acc3a4072b7df
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: rustdesk-by-roket
x-casaos:
