name: linuxserver-freecad
services:
  freecad:
    image: linuxserver/freecad:1.1.3@sha256:8c4f980d34120573fdef6df0d914eaf4d559a1c14b91521f2b13b168af4477dd
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/freecad/config
        target: /config
x-casaos:
  main: freecad
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.freecad/assets/icon.png
  title:
    en_US: Freecad
  port_map: '3000'
  id: by-roket.linuxserver.freecad
  version: 1.1.3
  index: /
