name: linuxserver-modmanager
services:
  modmanager:
    image: linuxserver/modmanager:version-b7faeafa
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/modmanager/config
        target: /config
x-casaos:
  main: modmanager
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.modmanager/assets/icon.png
  title:
    en_US: Modmanager
  port_map: '80'
  id: by-roket.linuxserver.modmanager
  version: version-b7faeafa
  index: /
