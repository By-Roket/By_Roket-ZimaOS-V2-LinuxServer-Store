name: linuxserver-grav
services:
  grav:
    image: linuxserver/grav:2.0.21@sha256:82c2cfedc5d0634034a26d0ca4c7addd6fea5b2f590a3d01239d3d6f5d1d6aa3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
x-casaos:
  main: grav
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.grav/assets/icon.png
  title:
    en_US: Grav
  port_map: '80'
  id: by-roket.linuxserver.grav
  version: 2.0.21
  index: /
