name: linuxserver-grav
services:
  grav:
    image: linuxserver/grav:2.1.5@sha256:be2d04082903041972afb98236cb6849eb8cb8ac03659d6babdaf514d386eb45
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: grav-by-roket
x-casaos:
  main: grav
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.grav/assets/icon.png
  title:
    en_US: Grav (LinuxServer.io)
  id: by-roket.linuxserver.grav
  port_map: '80'
  version: 2.1.5
  index: /
