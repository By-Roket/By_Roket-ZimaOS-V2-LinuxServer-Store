name: linuxserver-grav
services:
  grav:
    image: linuxserver/grav:2.0.24@sha256:69c38a823140701a2fc30092ec251ea288e975a472065b4fb173fab96df5fc0a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: grav-by-roket
x-casaos:
  main: grav
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.grav/assets/icon.png
  title:
    en_US: Grav (LinuxServer.io)
  id: by-roket.linuxserver.grav
  port_map: '80'
  version: 2.0.24
  index: /
