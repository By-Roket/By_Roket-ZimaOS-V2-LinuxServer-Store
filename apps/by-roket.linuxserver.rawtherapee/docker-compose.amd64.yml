name: linuxserver-rawtherapee
services:
  rawtherapee:
    image: linuxserver/rawtherapee:5.13.20260830@sha256:8464c00ba96efabceb3f7d2b079a6dbaad9f8a4b618abcad1655475b5dce4756
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: rawtherapee-by-roket
x-casaos:
  main: rawtherapee
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.rawtherapee/assets/icon.png
  title:
    en_US: Rawtherapee (LinuxServer.io)
  id: by-roket.linuxserver.rawtherapee
  port_map: '3000'
  version: 5.13.20260830
  index: /
