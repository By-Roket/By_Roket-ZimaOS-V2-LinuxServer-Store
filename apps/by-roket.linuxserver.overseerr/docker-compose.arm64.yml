  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.overseerr/assets/icon.png
  title:
    en_US: Overseerr
  port_map: '5055'
  id: by-roket.linuxserver.overseerr
  version: 1.33.2
  index: /
