name: linuxserver-overseerr
services:
  overseerr:
    image: linuxserver/overseerr:1.33.2@sha256:674ea06661a246df1d277635b70ee4d110e12933e2665498bd590c42d161ed89
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 5055
        published: 5055
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/overseerr/config
        target: /config
x-casaos:
