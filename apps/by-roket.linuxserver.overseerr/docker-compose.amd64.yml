name: linuxserver-overseerr
services:
  overseerr:
    image: linuxserver/overseerr:1.33.2@sha256:9b8546e7cb162b8470e49b5051a641fd9a4a61388e960647c77aa1f78402552f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 5055
        published: 5055
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: overseerr-by-roket
x-casaos:
