name: linuxserver-scummvm
services:
  scummvm:
    image: linuxserver/scummvm:2026.3.0@sha256:108c18a49554d2fc0972846754df42c845c08e9ce171ead094ef7e041e2c2ed7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: scummvm-by-roket
x-casaos:
