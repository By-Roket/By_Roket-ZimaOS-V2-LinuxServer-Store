name: linuxserver-requestrr
services:
  requestrr:
    image: linuxserver/requestrr:2.1.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 4545
        published: 4545
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: requestrr-by-roket
x-casaos:
  main: requestrr
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.requestrr/assets/icon.png
  title:
    en_US: Requestrr
  port_map: '4545'
  id: by-roket.linuxserver.requestrr
  version: 2.1.2
  index: /
