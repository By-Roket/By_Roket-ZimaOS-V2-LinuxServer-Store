name: linuxserver-dosbox-staging
services:
  dosbox-staging:
    image: linuxserver/dosbox-staging:0.83.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: dosbox-staging-by-roket
x-casaos:
  main: dosbox-staging
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.dosbox-staging/assets/icon.png
  title:
    en_US: Dosbox staging
  port_map: '3000'
  id: by-roket.linuxserver.dosbox-staging
  version: 0.83.0
  index: /
