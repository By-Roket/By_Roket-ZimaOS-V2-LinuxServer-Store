    image: linuxserver/unrar:7.0.9@sha256:260d0c7493f287ce31903a06d0b1e77fe0f39fb21f9af70c3744e119ae2840c6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
