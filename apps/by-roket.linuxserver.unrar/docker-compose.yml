name: linuxserver-unrar
services:
  app:
    image: linuxserver/unrar:7.0.9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/unrar/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.unrar/assets/icon.png
  title:
    en_US: Unrar
  port_map: '80'
  id: by-roket.linuxserver.unrar
  version: 7.0.9
  index: /
