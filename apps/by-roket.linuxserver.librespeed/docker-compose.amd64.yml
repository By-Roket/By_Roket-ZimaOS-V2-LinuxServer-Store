name: linuxserver-librespeed
services:
  librespeed:
    image: linuxserver/librespeed:6.3.0@sha256:c39fd9b8279fcc7be3d280aa4bf8e10c889982bbe83049cd0c5283db8e49fc57
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PASSWORD: ''
      CUSTOM_RESULTS: ''
      DB_TYPE: ''
      DB_NAME: ''
      DB_HOSTNAME: ''
      DB_USERNAME: ''
      DB_PASSWORD: ''
      DB_PORT: ''
      IPINFO_APIKEY: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: librespeed-by-roket
x-casaos:
  main: librespeed
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.librespeed/assets/icon.png
  title:
    en_US: Librespeed (LinuxServer.io)
  id: by-roket.linuxserver.librespeed
  port_map: '80'
  version: 6.3.0
  index: /
