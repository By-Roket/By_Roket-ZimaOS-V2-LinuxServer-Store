name: linuxserver-librespeed
services:
  librespeed:
    image: linuxserver/librespeed:6.2.1@sha256:0409cb017ddde8b5d96848857a6b469d13992dd17256f6d6f0c32e163fb2720f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PASSWORD: ''
      CUSTOM_RESULTS: ''
      DB_TYPE: ''
      DB_NAME: ''
      DB_HOSTNAME: ''
      DB_USERNAME: ''
      DB_PASSWORD: ''
      DB_PORT: ''
      IPINFO_APIKEY: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/librespeed/config
        target: /config
x-casaos:
  main: librespeed
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.librespeed/assets/icon.png
  title:
    en_US: Librespeed
  port_map: '80'
  id: by-roket.linuxserver.librespeed
  version: 6.2.1
  index: /
