name: linuxserver-wps-office
services:
  wps-office:
    image: linuxserver/wps-office:11.1.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/wps-office/config
        target: /config
x-casaos:
  main: wps-office
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.wps-office/assets/icon.png
  title:
    en_US: Wps office
  port_map: '3000'
  id: by-roket.linuxserver.wps-office
  version: 11.1.0
  index: /
