name: linuxserver-wps-office
services:
  wps-office:
    image: linuxserver/wps-office:11.1.0@sha256:a9f1d2eb4122042ff9dc582b38b699ed6a1a5abc1a7374b1b0fa0f237331b341
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: wps-office-by-roket
x-casaos:
  main: wps-office
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.wps-office/assets/icon.png
  title:
    en_US: Wps office
  port_map: '3000'
  id: by-roket.linuxserver.wps-office
  version: 11.1.0
  index: /
