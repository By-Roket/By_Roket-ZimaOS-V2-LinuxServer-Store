name: linuxserver-kimai
services:
  kimai:
    image: linuxserver/kimai:2.67.0@sha256:f16e009891896ac1b6f2336016da35c2a92a10a2dff1ee4df368484ce9be0057
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_SECRET: ''
      DATABASE_URL: ''
      TRUSTED_HOSTS: ''
      TRUSTED_PROXIES: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: kimai-by-roket
x-casaos:
  main: kimai
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.kimai/assets/icon.png
  title:
    en_US: Kimai (LinuxServer.io)
  id: by-roket.linuxserver.kimai
  port_map: '80'
  version: 2.67.0
  index: /
