name: linuxserver-kimai
services:
  kimai:
    image: linuxserver/kimai:2.65.0@sha256:e4ff9f963dd628ffd16b1ff9d253f6c53bf4bdccdd8199d3b144760ff571283f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_SECRET: ''
      DATABASE_URL: ''
      TRUSTED_HOSTS: ''
      TRUSTED_PROXIES: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: kimai-by-roket
x-casaos:
  main: kimai
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.kimai/assets/icon.png
  title:
    en_US: Kimai (LinuxServer.io)
  id: by-roket.linuxserver.kimai
  port_map: '80'
  version: 2.65.0
  index: /
