name: linuxserver-weixin
services:
  weixin:
    image: linuxserver/weixin:version-e4e2f31c@sha256:953783c35fc7b8d404a4d33af1ad5dd2a4946d8e00ba846aabee4a38c9316a2e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: weixin-by-roket
x-casaos:
  main: weixin
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.weixin/assets/icon.png
  title:
    en_US: Weixin (LinuxServer.io)
  id: by-roket.linuxserver.weixin
  port_map: '3000'
  version: version-e4e2f31c
  index: /
