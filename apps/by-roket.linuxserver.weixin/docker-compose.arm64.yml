name: linuxserver-weixin
services:
  app:
    image: linuxserver/weixin:version-1bb46de6@sha256:9869b83006bd21ca5e96c9ef9c89f1b267bf6c27ea2d6c04ada9e4ae79926cab
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/weixin/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.weixin/assets/icon.png
  title:
    en_US: Weixin
  port_map: '3000'
  id: by-roket.linuxserver.weixin
  version: version-1bb46de6
  index: /
