name: linuxserver-shotcut
services:
  app:
    image: linuxserver/shotcut:26.8.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/shotcut/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.shotcut/assets/icon.png
  title:
    en_US: Shotcut
  port_map: '3000'
  id: by-roket.linuxserver.shotcut
  version: 26.8.1
  index: /
