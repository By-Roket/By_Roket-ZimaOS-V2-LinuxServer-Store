name: linuxserver-shotcut
services:
  shotcut:
    image: linuxserver/shotcut:26.8.1@sha256:39a38d379b4edda8e6352eb763453078aa20e5f15f810badb6fdc1733bbe7a4f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: shotcut-by-roket
x-casaos:
  main: shotcut
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.shotcut/assets/icon.png
  title:
    en_US: Shotcut
  port_map: '3000'
  id: by-roket.linuxserver.shotcut
  version: 26.8.1
  index: /
