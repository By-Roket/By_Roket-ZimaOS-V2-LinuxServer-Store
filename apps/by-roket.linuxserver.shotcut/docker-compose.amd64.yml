name: linuxserver-shotcut
services:
  shotcut:
    image: linuxserver/shotcut:26.8.1@sha256:39a38d379b4edda8e6352eb763453078aa20e5f15f810badb6fdc1733bbe7a4f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: shotcut-by-roket
