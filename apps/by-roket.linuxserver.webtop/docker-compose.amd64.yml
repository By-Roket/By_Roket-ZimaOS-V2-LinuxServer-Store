name: linuxserver-webtop
services:
  webtop:
    image: linuxserver/webtop:arch-kde-version-2025-07-12@sha256:da08c127461269d148bf8191a85b8da735c8516969100dc3c63d7877b15302aa
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: webtop-by-roket
x-casaos:
  main: webtop
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.webtop/assets/icon.png
  title:
    en_US: Webtop
  port_map: '3000'
  id: by-roket.linuxserver.webtop
  version: arch-kde-version-2025-07-12
  index: /
