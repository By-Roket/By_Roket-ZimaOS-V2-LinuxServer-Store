name: linuxserver-webtop
services:
  app:
    image: linuxserver/webtop:arch-kde-version-2025-07-12@sha256:1d7977ab0afc978c42c56e3bfe2287f90c9072ce5fe77c9c4a3263e343dfa1ec
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webtop/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.webtop/assets/icon.png
  title:
    en_US: Webtop
  port_map: '3000'
  id: by-roket.linuxserver.webtop
  version: arch-kde-version-2025-07-12
  index: /
