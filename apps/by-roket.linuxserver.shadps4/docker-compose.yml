name: linuxserver-shadps4
services:
  shadps4:
    image: linuxserver/shadps4:version-shadPS4QtLauncher-2026-09-23-ded9bb828331067cba3865a355b08859c324bc4c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: shadps4-by-roket
