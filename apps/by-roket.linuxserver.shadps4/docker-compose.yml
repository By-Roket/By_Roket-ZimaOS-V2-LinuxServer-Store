name: linuxserver-shadps4
services:
  shadps4:
    image: linuxserver/shadps4:version-shadPS4QtLauncher-2026-08-23-a96ca3ec022d660964e7e1f9a618131b6dc52a3a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: shadps4-by-roket
x-casaos:
