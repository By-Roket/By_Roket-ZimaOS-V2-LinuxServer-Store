name: linuxserver-shadps4
services:
  shadps4:
    image: linuxserver/shadps4:shadPS4QtLauncher-2026-08-31-bcebdf7d53eaff384d62bfef169a4e98ce284390-ls39@sha256:6653d34c76bac75216c2de8aa8f2915241416377a325a8efa1f6c67984fcd805
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: shadps4-by-roket
