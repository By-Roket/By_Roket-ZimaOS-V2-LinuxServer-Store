name: linuxserver-intellij-idea
services:
  app:
    image: linuxserver/intellij-idea:42026.2.0@sha256:73b65d4e93361ec563b7b9eb275061c795cdae99232527f9875e63437b3d3993
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/intellij-idea/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.intellij-idea/assets/icon.png
  title:
    en_US: Intellij idea
  port_map: '3000'
  id: by-roket.linuxserver.intellij-idea
  version: 42026.2.0
  index: /
