name: linuxserver-monica
services:
  monica:
    image: linuxserver/monica:4.1.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DB_HOST: ''
      DB_PORT: ''
      DB_USERNAME: ''
      DB_PASSWORD: ''
      DB_DATABASE: ''
      APP_URL: ''
      TRUSTED_PROXIES: ''
      APP_ENV: ''
      APP_DISABLE_SIGNUP: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: monica-by-roket
x-casaos:
  main: monica
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.monica/assets/icon.png
  title:
    en_US: Monica
  port_map: '80'
  id: by-roket.linuxserver.monica
  version: 4.1.2
  index: /
