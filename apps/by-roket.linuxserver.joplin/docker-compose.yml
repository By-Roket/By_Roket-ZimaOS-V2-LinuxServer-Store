name: linuxserver-joplin
services:
  joplin:
    image: linuxserver/joplin:3.6.16
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: joplin-by-roket
x-casaos:
  main: joplin
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.joplin/assets/icon.png
  title:
    en_US: Joplin (LinuxServer.io)
  id: by-roket.linuxserver.joplin
  port_map: '3000'
  version: 3.6.16
  index: /
