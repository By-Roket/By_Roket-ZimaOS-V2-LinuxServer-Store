name: linuxserver-cops
services:
  cops:
    image: linuxserver/cops:4.5.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/books
        target: /books
    container_name: cops-by-roket
x-casaos:
  main: cops
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.cops/assets/icon.png
  title:
    en_US: Cops (LinuxServer.io)
  id: by-roket.linuxserver.cops
  port_map: '80'
  version: 4.5.2
  index: /
