name: linuxserver-bookstack
services:
  bookstack:
    image: linuxserver/bookstack:26.05.5@sha256:cc2edb629faa5d1809a4fb54ba1c9431c736f1ab83e2a5ddbb49026c28a3ed06
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_URL: ''
      APP_KEY: ''
      DB_HOST: ''
      DB_PORT: ''
      DB_USERNAME: ''
      DB_PASSWORD: ''
      DB_DATABASE: ''
      QUEUE_CONNECTION: ''
    ports:
      - target: 6875
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: bookstack-by-roket
x-casaos:
  main: bookstack
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.bookstack/assets/icon.png
  title:
    en_US: Bookstack (LinuxServer.io)
  id: by-roket.linuxserver.bookstack
  port_map: '80'
  version: 26.05.5
  index: /
