name: linuxserver-jellyfin
services:
  jellyfin:
    image: linuxserver/jellyfin:10.11.11
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      JELLYFIN_PublishedServerUrl: ''
    ports:
      - target: 8096
        published: 8096
        protocol: tcp
      - target: 8920
        published: 8920
        protocol: tcp
      - target: 7359
        published: 7359
        protocol: udp
      - target: 1900
        published: 1900
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/data/tvshows
        target: /data/tvshows
      - type: bind
        source: /DATA/AppData/$AppID/data/movies
        target: /data/movies
    container_name: jellyfin-by-roket
x-casaos:
  main: jellyfin
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.jellyfin/assets/icon.png
  title:
    en_US: Jellyfin (LinuxServer.io)
  id: by-roket.linuxserver.jellyfin
  version: 10.11.11
  index: /
  port_map: '8096'
