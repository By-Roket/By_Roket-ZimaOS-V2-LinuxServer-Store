name: linuxserver-freshrss
services:
  freshrss:
    image: linuxserver/freshrss:1.30.0@sha256:a22bf898c2d93bd3d9459177e880af6a40cdfb8b2665e570a28ddde9f74c4b6c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: freshrss-by-roket
x-casaos:
  main: freshrss
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.freshrss/assets/icon.png
  title:
    en_US: Freshrss (LinuxServer.io)
  id: by-roket.linuxserver.freshrss
  port_map: '80'
  version: 1.30.0
  index: /
