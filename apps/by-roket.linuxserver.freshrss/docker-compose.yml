name: linuxserver-freshrss
services:
  app:
    image: linuxserver/freshrss:1.29.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/freshrss/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.freshrss/assets/icon.png
  title:
    en_US: Freshrss
  port_map: '80'
  id: by-roket.linuxserver.freshrss
  version: 1.29.1
  index: /
