name: linuxserver-embystat
services:
  embystat:
    image: linuxserver/embystat:0.2.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 6555
        published: 6555
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: embystat-by-roket
x-casaos:
  main: embystat
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.embystat/assets/icon.png
  title:
    en_US: Embystat
  port_map: '6555'
  id: by-roket.linuxserver.embystat
  version: 0.2.0
  index: /
