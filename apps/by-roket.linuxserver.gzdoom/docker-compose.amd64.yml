name: linuxserver-gzdoom
services:
  gzdoom:
    image: linuxserver/gzdoom:4.14.2@sha256:39021e27dd22690269cecf9471863ecb7a5b5ad3568efb227d954eee1affc736
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: gzdoom-by-roket
x-casaos:
  main: gzdoom
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.gzdoom/assets/icon.png
  title:
    en_US: Gzdoom
  port_map: '3000'
  id: by-roket.linuxserver.gzdoom
  version: 4.14.2
  index: /
