name: linuxserver-planka
services:
  planka:
    image: linuxserver/planka:2.2.1@sha256:94f0e6a8d437906503a7a185eae67eaec4c75ae676a83f61f32caf0ef5af9d73
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      BASE_URL: ''
      DATABASE_URL: ''
      DEFAULT_ADMIN_EMAIL: ''
      DEFAULT_ADMIN_USERNAME: ''
      DEFAULT_ADMIN_PASSWORD: ''
      DEFAULT_ADMIN_NAME: ''
      SECRET_KEY: ''
      TRUST_PROXY: ''
      DEFAULT_LANGUAGE: ''
    ports:
      - target: 1337
        published: 1337
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: planka-by-roket
