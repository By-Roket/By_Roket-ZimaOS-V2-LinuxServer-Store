name: linuxserver-snapdrop
services:
  app:
    image: linuxserver/snapdrop:version-f88d46ed@sha256:3246c5455902587bf327855cc83784d6dff9122d9ee53c6ec3567368a4bc8d7f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/snapdrop/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.snapdrop/assets/icon.png
  title:
    en_US: Snapdrop
  port_map: '80'
  id: by-roket.linuxserver.snapdrop
  version: version-f88d46ed
  index: /
