name: linuxserver-oscam
services:
  oscam:
    image: linuxserver/oscam:version-11966@sha256:2d1ee2f4878fb991a7bba42f37cb362da29982b9ad65868a51901a66653ea95a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8888
        published: 8888
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/oscam/config
        target: /config
