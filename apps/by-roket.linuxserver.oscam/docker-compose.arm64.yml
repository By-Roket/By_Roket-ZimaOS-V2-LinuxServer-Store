name: linuxserver-oscam
services:
  oscam:
    image: linuxserver/oscam:version-11966@sha256:a23994d6b04a6154a922bd2f2ac30268375574c14da8d3a0ee77014e352032b8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8888
        published: 8888
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: oscam-by-roket
x-casaos:
  main: oscam
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.oscam/assets/icon.png
  title:
    en_US: Oscam (LinuxServer.io)
  id: by-roket.linuxserver.oscam
  port_map: '8888'
  version: version-11966
  index: /
