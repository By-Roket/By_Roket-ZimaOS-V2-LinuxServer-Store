name: linuxserver-hedgedoc
services:
  hedgedoc:
    image: linuxserver/hedgedoc:1.12.0@sha256:f76d1edeeb10f51c407248b306b26791c641f41ff6bd58af96ccc0b026fd5b3d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DB_HOST: ''
      DB_PORT: ''
      DB_USER: ''
      DB_PASS: ''
      DB_NAME: ''
      CMD_DOMAIN: ''
      CMD_URL_ADDPORT: ''
      CMD_PROTOCOL_USESSL: ''
      CMD_PORT: ''
      CMD_ALLOW_ORIGIN: ''
      CMD_DB_DIALECT: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/hedgedoc/config
        target: /config
x-casaos:
  main: hedgedoc
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.hedgedoc/assets/icon.png
  title:
    en_US: Hedgedoc
  port_map: '3000'
  id: by-roket.linuxserver.hedgedoc
  version: 1.12.0
  index: /
