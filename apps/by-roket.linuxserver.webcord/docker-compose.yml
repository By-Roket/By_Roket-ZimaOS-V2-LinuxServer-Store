name: linuxserver-webcord
services:
  webcord:
    image: linuxserver/webcord:4.14.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: webcord-by-roket
x-casaos:
  main: webcord
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.webcord/assets/icon.png
  title:
    en_US: Webcord
  port_map: '3000'
  id: by-roket.linuxserver.webcord
  version: 4.14.0
  index: /
