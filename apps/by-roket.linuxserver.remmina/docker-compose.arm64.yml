name: linuxserver-remmina
services:
  app:
    image: linuxserver/remmina:1.4.40@sha256:7bff14144c3f6cde8ead26a7a9d0eadc250fb54fd1442e97017afebff74afd3e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/remmina/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.remmina/assets/icon.png
  title:
    en_US: Remmina
  port_map: '3000'
  id: by-roket.linuxserver.remmina
  version: 1.4.40
  index: /
