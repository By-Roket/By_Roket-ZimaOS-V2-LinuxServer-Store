name: linuxserver-domoticz
services:
  app:
    image: linuxserver/domoticz:2023.2.20231129
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      WEBROOT: ''
      DBASE: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
      - target: 6144
        published: 6144
        protocol: tcp
      - target: 1443
        published: 1443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/domoticz/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.domoticz/assets/icon.png
  title:
    en_US: Domoticz
  port_map: '8080'
  id: by-roket.linuxserver.domoticz
  version: 2023.2.20231129
  index: /
