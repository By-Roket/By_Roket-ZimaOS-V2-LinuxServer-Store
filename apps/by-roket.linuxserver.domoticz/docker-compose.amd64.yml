name: linuxserver-domoticz
services:
  domoticz:
    image: linuxserver/domoticz:2023.2.20231129@sha256:29eeac689439899f4d3521273a8bb7cf434de2f3b8300e2abfd368555a099a8f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      WEBROOT: ''
      DBASE: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
      - target: 6144
        published: 6144
        protocol: tcp
      - target: 1443
        published: 1443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: domoticz-by-roket
x-casaos:
  main: domoticz
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.domoticz/assets/icon.png
  title:
    en_US: Domoticz
  port_map: '8080'
  id: by-roket.linuxserver.domoticz
  version: 2023.2.20231129
  index: /
