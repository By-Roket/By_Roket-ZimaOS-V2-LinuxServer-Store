name: linuxserver-domoticz
services:
  domoticz:
    image: linuxserver/domoticz:2023.2.20231129@sha256:e642693c0f5fdd8f5c78fd0cc77c4201df3d19d90b756c0d0259beadfff1efc6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      WEBROOT: ''
      DBASE: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
      - target: 6144
        published: 6144
        protocol: tcp
      - target: 1443
        published: 1443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/domoticz/config
        target: /config
x-casaos:
  main: domoticz
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.domoticz/assets/icon.png
  title:
    en_US: Domoticz
  port_map: '8080'
  id: by-roket.linuxserver.domoticz
  version: 2023.2.20231129
  index: /
