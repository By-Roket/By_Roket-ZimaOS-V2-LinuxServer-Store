name: linuxserver-smokeping
services:
  smokeping:
    image: linuxserver/smokeping:2.9.0@sha256:b8af268f4726926a3ae7434ff9a2df2da0a2813e498a90b6fce12c43bb623594
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MASTER_URL: ''
      SHARED_SECRET: ''
      CACHE_DIR: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    container_name: smokeping-by-roket
