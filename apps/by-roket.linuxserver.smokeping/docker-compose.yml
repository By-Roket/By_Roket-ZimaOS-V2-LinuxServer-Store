name: linuxserver-smokeping
services:
  smokeping:
    image: linuxserver/smokeping:2.9.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MASTER_URL: ''
      SHARED_SECRET: ''
      CACHE_DIR: ''
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/smokeping/config
        target: /config
      - type: bind
        source: /DATA/AppData/smokeping/data
        target: /data
x-casaos:
  main: smokeping
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.smokeping/assets/icon.png
  title:
    en_US: Smokeping
  port_map: '80'
  id: by-roket.linuxserver.smokeping
  version: 2.9.0
  index: /
