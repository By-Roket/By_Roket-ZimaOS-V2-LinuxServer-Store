name: linuxserver-hishtory-server
services:
  app:
    image: linuxserver/hishtory-server:0.335.20260821@sha256:007a15aa6136de84ad3f485b074d898b4f8e912df0fbb78e0105e488842c270b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HISHTORY_POSTGRES_DB: ''
      HISHTORY_SQLITE_DB: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/hishtory-server/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.hishtory-server/assets/icon.png
  title:
    en_US: Hishtory server
  port_map: '8080'
  id: by-roket.linuxserver.hishtory-server
  version: 0.335.20260821
  index: /
