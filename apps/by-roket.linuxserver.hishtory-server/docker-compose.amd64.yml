name: linuxserver-hishtory-server
services:
  hishtory-server:
    image: linuxserver/hishtory-server:0.335.20260904@sha256:5d000ac754b1a7f7f35ceee3bab597585397d16e5ef4a32de038809c9556983d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HISHTORY_POSTGRES_DB: ''
      HISHTORY_SQLITE_DB: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: hishtory-server-by-roket
x-casaos:
  main: hishtory-server
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.hishtory-server/assets/icon.png
  title:
    en_US: Hishtory server (LinuxServer.io)
  id: by-roket.linuxserver.hishtory-server
  port_map: '8080'
  version: 0.335.20260904
  index: /
