name: linuxserver-filezilla
services:
  filezilla:
    image: linuxserver/filezilla:3.69.6@sha256:111e1f86f40a091748c1a87fe545e12f427d512172cc696d65544dee5e57275f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: filezilla-by-roket
x-casaos:
  main: filezilla
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.filezilla/assets/icon.png
  title:
    en_US: Filezilla (LinuxServer.io)
  id: by-roket.linuxserver.filezilla
  port_map: '3000'
  version: 3.69.6
  index: /
