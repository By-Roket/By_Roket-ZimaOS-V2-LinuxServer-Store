name: linuxserver-pcsx2
services:
  app:
    image: linuxserver/pcsx2:2.6.3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pcsx2/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.pcsx2/assets/icon.png
  title:
    en_US: Pcsx2
  port_map: '3000'
  id: by-roket.linuxserver.pcsx2
  version: 2.6.3
  index: /
