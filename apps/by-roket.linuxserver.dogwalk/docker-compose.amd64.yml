name: linuxserver-dogwalk
services:
  dogwalk:
    image: linuxserver/dogwalk:e47ccf5d-ls52@sha256:e7972ef13e023ce038dc66b15b6a4264efaec59a21122e60046bbaf1244a3c70
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: dogwalk-by-roket
x-casaos:
  main: dogwalk
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.dogwalk/assets/icon.png
  title:
    en_US: Dogwalk (LinuxServer.io)
  id: by-roket.linuxserver.dogwalk
  port_map: '3000'
  version: e47ccf5d-ls52
  index: /
