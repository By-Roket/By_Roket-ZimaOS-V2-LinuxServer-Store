name: linuxserver-dogwalk
services:
  dogwalk:
    image: linuxserver/dogwalk:version-b93769c4@sha256:85b36778377c5b156b014772b8ebb196762c8b4014e54ad99daf57df0a523f1f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: dogwalk-by-roket
x-casaos:
  main: dogwalk
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.dogwalk/assets/icon.png
  title:
    en_US: Dogwalk (LinuxServer.io)
  id: by-roket.linuxserver.dogwalk
  port_map: '3000'
  version: version-b93769c4
  index: /
