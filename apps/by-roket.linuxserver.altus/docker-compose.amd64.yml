name: linuxserver-altus
services:
  altus:
    image: linuxserver/altus:5.8.1@sha256:d63d5023a7e4457e6aba14fd31ef055387248e9689ff850a85c36a6c3f6d44f6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: altus-by-roket
x-casaos:
  main: altus
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.altus/assets/icon.png
  title:
    en_US: Altus
  port_map: '3000'
  id: by-roket.linuxserver.altus
  version: 5.8.1
  index: /
