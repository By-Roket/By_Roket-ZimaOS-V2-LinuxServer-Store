name: linuxserver-swag
services:
  swag:
    image: linuxserver/swag:5.8.0@sha256:5b5e34846bc9e98a0efaabf63dbe065703d2d5330732ff604519ce507c7c2b3d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      URL: ''
      VALIDATION: ''
      SUBDOMAINS: ''
      CERTPROVIDER: ''
      CERT_PROFILE: ''
      DNSPLUGIN: ''
      PROPAGATION: ''
      EMAIL: ''
      ONLY_SUBDOMAINS: ''
      EXTRA_DOMAINS: ''
      STAGING: ''
      DISABLE_F2B: ''
      SWAG_AUTORELOAD: ''
      SWAG_AUTORELOAD_WATCHLIST: ''
    ports:
      - target: 443
        published: 443
        protocol: tcp
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: swag-by-roket
x-casaos:
  main: swag
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.swag/assets/icon.gif
  title:
    en_US: Swag (LinuxServer.io)
  id: by-roket.linuxserver.swag
  port_map: '80'
  version: 5.8.0
  index: /
