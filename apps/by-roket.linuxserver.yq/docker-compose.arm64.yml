name: linuxserver-yq
services:
  yq:
    image: linuxserver/yq:3.4.3@sha256:a9827d71e6b83fb0951eb7f783141ebd0a4f1b6b37b39049e4dd8a8b256c15e9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/yq/config
        target: /config
x-casaos:
  main: yq
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.yq/assets/icon.png
  title:
    en_US: Yq
  port_map: '80'
  id: by-roket.linuxserver.yq
  version: 3.4.3
  index: /
