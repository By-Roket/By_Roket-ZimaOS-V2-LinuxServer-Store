name: linuxserver-sqlitebrowser
services:
  sqlitebrowser:
    image: linuxserver/sqlitebrowser:3.13.1@sha256:1d38cb9ebb5d26a63d0bac07224069a2471e03d4dfca6e72deb8f819e9434370
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: sqlitebrowser-by-roket
x-casaos:
