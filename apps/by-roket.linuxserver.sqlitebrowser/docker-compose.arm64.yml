name: linuxserver-sqlitebrowser
services:
  app:
    image: linuxserver/sqlitebrowser:3.13.1@sha256:7eb3ec084bcf366d15e067b8bae6a86935d1c31a429eb6ba431ff316b0a8b084
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/sqlitebrowser/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.sqlitebrowser/assets/icon.png
  title:
    en_US: Sqlitebrowser
  port_map: '3000'
  id: by-roket.linuxserver.sqlitebrowser
  version: 3.13.1
  index: /
