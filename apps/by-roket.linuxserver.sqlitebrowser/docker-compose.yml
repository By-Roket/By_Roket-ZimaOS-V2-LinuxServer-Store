name: linuxserver-sqlitebrowser
services:
  sqlitebrowser:
    image: linuxserver/sqlitebrowser:3.13.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: sqlitebrowser-by-roket
x-casaos:
  main: sqlitebrowser
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.sqlitebrowser/assets/icon.png
  title:
    en_US: Sqlitebrowser
  port_map: '3000'
  id: by-roket.linuxserver.sqlitebrowser
  version: 3.13.1
  index: /
