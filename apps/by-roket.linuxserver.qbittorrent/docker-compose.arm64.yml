name: linuxserver-qbittorrent
services:
  app:
    image: linuxserver/qbittorrent:5.2.3@sha256:31430e5da7490f4f785f1ff80eb35a2f7deac08a73e5c5ebc895233cf17f408b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      WEBUI_PORT: ''
      TORRENTING_PORT: ''
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
      - target: 6881
        published: 6881
        protocol: tcp
      - target: 6881
        published: 6881
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/qbittorrent/config
        target: /config
      - type: bind
        source: /DATA/AppData/qbittorrent/downloads
        target: /downloads
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.qbittorrent/assets/icon.png
  title:
    en_US: Qbittorrent
  port_map: '8080'
  id: by-roket.linuxserver.qbittorrent
  version: 5.2.3
  index: /
