name: linuxserver-blender
services:
  app:
    image: linuxserver/blender:5.2.0@sha256:4cd8035b6ec05da5790491d268e1e9a446a2fbad07fbe3465d9f5bcb9824da50
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/blender/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.blender/assets/icon.png
  title:
    en_US: Blender
  port_map: '3000'
  id: by-roket.linuxserver.blender
  version: 5.2.0
  index: /
