name: linuxserver-airsonic-advanced
services:
  app:
    image: linuxserver/airsonic-advanced:11.1.4@sha256:2ba60bf0fc241f64457362089e5a6d1392b79d1a4646704eae758262869f448c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONTEXT_PATH: ''
      JAVA_OPTS: ''
    ports:
      - target: 4040
        published: 4040
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/airsonic-advanced/config
        target: /config
      - type: bind
        source: /DATA/AppData/airsonic-advanced/music
        target: /music
      - type: bind
        source: /DATA/AppData/airsonic-advanced/playlists
        target: /playlists
      - type: bind
        source: /DATA/AppData/airsonic-advanced/podcasts
        target: /podcasts
      - type: bind
        source: /DATA/AppData/airsonic-advanced/media
        target: /media
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.airsonic-advanced/assets/icon.png
  title:
    en_US: Airsonic advanced
  port_map: '4040'
  id: by-roket.linuxserver.airsonic-advanced
  version: 11.1.4
  index: /
