name: linuxserver-mullvad-browser
services:
  mullvad-browser:
    image: linuxserver/mullvad-browser:15.0.21@sha256:40c2d406c646379e5fcfd806881139033680a92fa3c87e42676f1184c93ce0c2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LOCAL_NET: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/Downloads
        target: /config/Downloads
    cap_add:
      - NET_ADMIN
    shm_size: 1gb
    container_name: mullvad-browser-by-roket
x-casaos:
  main: mullvad-browser
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.mullvad-browser/assets/icon.png
  title:
    en_US: Mullvad browser (LinuxServer.io)
  id: by-roket.linuxserver.mullvad-browser
  port_map: '3000'
  version: 15.0.21
  index: /
