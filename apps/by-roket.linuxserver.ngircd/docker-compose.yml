name: linuxserver-ngircd
services:
  app:
    image: linuxserver/ngircd:version-27-r1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 6667
        published: 6667
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ngircd/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.ngircd/assets/icon.png
  title:
    en_US: Ngircd
  port_map: '6667'
  id: by-roket.linuxserver.ngircd
  version: version-27-r1
  index: /
