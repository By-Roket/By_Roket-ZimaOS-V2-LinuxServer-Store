name: linuxserver-vivaldi
services:
  vivaldi:
    image: linuxserver/vivaldi:8.1.4087@sha256:41c216e60c412f9fa0164bdf349da70fdfa62921fbb4ff5a6471ebc719f36d2a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VIVALDI_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vivaldi/config
        target: /config
x-casaos:
  main: vivaldi
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.vivaldi/assets/icon.png
  title:
    en_US: Vivaldi
  port_map: '3000'
  id: by-roket.linuxserver.vivaldi
  version: 8.1.4087
  index: /
