name: linuxserver-vivaldi
services:
  vivaldi:
    image: linuxserver/vivaldi:8.1.4087
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VIVALDI_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: vivaldi-by-roket
x-casaos:
  main: vivaldi
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.vivaldi/assets/icon.png
  title:
    en_US: Vivaldi (LinuxServer.io)
  id: by-roket.linuxserver.vivaldi
  port_map: '3000'
  version: 8.1.4087
  index: /
