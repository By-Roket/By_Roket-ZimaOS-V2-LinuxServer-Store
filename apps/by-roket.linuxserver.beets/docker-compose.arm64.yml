name: linuxserver-beets
services:
  beets:
    image: linuxserver/beets:2.14.0@sha256:e5cffd34cab419cb41a43d6c75b739a1d7d89937dc110fca75bc56d70f866549
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8337
        published: 8337
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/music
        target: /music
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
    container_name: beets-by-roket
x-casaos:
  main: beets
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.beets/assets/icon.png
  title:
    en_US: Beets (LinuxServer.io)
  id: by-roket.linuxserver.beets
  port_map: '8337'
  version: 2.14.0
  index: /
