name: linuxserver-pycharm
services:
  app:
    image: linuxserver/pycharm:2026.2.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pycharm/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.pycharm/assets/icon.png
  title:
    en_US: Pycharm
  port_map: '3000'
  id: by-roket.linuxserver.pycharm
  version: 2026.2.1
  index: /
