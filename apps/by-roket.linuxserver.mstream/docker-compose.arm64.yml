name: linuxserver-mstream
services:
  mstream:
    image: linuxserver/mstream:6.26.0@sha256:912815f2976de164c5c156c2f4cb8f0d87294207b5dac76762cf97af045c12fe
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/music
        target: /music
    container_name: mstream-by-roket
x-casaos:
  main: mstream
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.mstream/assets/icon.png
  title:
    en_US: Mstream (LinuxServer.io)
  id: by-roket.linuxserver.mstream
  port_map: '3000'
  version: 6.26.0
  index: /
