name: linuxserver-mstream
services:
  mstream:
    image: linuxserver/mstream:6.25.0@sha256:8466888db5786e7937d55b66b29323ed26c9ff94d7e96c8cd52981dfdc76faaa
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/music
        target: /music
    container_name: mstream-by-roket
x-casaos:
  main: mstream
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.mstream/assets/icon.png
  title:
    en_US: Mstream (LinuxServer.io)
  id: by-roket.linuxserver.mstream
  port_map: '3000'
  version: 6.25.0
  index: /
