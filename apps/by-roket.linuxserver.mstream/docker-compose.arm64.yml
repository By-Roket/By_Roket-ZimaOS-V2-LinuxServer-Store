name: linuxserver-mstream
services:
  mstream:
    image: linuxserver/mstream:6.28.1@sha256:98c8397f50eeea9a1d640211ebae80c1c9abf386475353c11a6ac554b2b75d46
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/music
        target: /music
    container_name: mstream-by-roket
