name: linuxserver-ferdium
services:
  ferdium:
    image: linuxserver/ferdium:7.2.3@sha256:8b95f44a86e362679afb81c17ea17b25de79cad63542a5b11190d6e053ae0170
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: ferdium-by-roket
x-casaos:
