name: linuxserver-ferdium
services:
  app:
    image: linuxserver/ferdium:7.2.1@sha256:6539566cf49c0e9b9c24462733c4f7a8e485dec6082754e085120efd9321977f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ferdium/config
        target: /config
x-casaos:
  main: app
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.ferdium/assets/icon.png
  title:
    en_US: Ferdium
  port_map: '3000'
  id: by-roket.linuxserver.ferdium
  version: 7.2.1
  index: /
