name: linuxserver-telegram
services:
  telegram:
    image: linuxserver/telegram:7.0.9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/telegram/config
        target: /config
x-casaos:
  main: telegram
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.telegram/assets/icon.png
  title:
    en_US: Telegram
  port_map: '3000'
  id: by-roket.linuxserver.telegram
  version: 7.0.9
  index: /
