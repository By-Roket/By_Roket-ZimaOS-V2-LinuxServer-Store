name: linuxserver-telegram
services:
  telegram:
    image: linuxserver/telegram:7.0.9@sha256:2f59b2aed9c7a5688aabd6b7c85bd71d646e8a7ec6ebd87c5b2c95d25c37cd6b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: telegram-by-roket
x-casaos:
  main: telegram
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.telegram/assets/icon.png
  title:
    en_US: Telegram
  port_map: '3000'
  id: by-roket.linuxserver.telegram
  version: 7.0.9
  index: /
