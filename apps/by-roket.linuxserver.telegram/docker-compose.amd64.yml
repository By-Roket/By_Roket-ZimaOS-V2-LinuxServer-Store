name: linuxserver-telegram
services:
  telegram:
    image: linuxserver/telegram:7.1.5@sha256:bbf6e383dbf05b02b07020ec9b27eee9a97dd6c2f724e7f4f64f8bea8a91435f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: telegram-by-roket
x-casaos:
  main: telegram
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.telegram/assets/icon.png
  title:
    en_US: Telegram (LinuxServer.io)
  id: by-roket.linuxserver.telegram
  port_map: '3000'
  version: 7.1.5
  index: /
