name: linuxserver-telegram
services:
  telegram:
    image: linuxserver/telegram:7.1.3@sha256:c1d999936962d3e688cd4ab4cd773464c0685b7207e399390f7185fb6b5116fe
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: telegram-by-roket
x-casaos:
  main: telegram
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.telegram/assets/icon.png
  title:
    en_US: Telegram (LinuxServer.io)
  id: by-roket.linuxserver.telegram
  port_map: '3000'
  version: 7.1.3
  index: /
