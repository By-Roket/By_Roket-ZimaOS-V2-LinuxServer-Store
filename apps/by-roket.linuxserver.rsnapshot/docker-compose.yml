name: linuxserver-rsnapshot
services:
  rsnapshot:
    image: linuxserver/rsnapshot:1.4.5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/.snapshots
        target: /.snapshots
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    container_name: rsnapshot-by-roket
x-casaos:
  main: rsnapshot
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.rsnapshot/assets/icon.png
  title:
    en_US: Rsnapshot
  port_map: '80'
  id: by-roket.linuxserver.rsnapshot
  version: 1.4.5
  index: /
