name: linuxserver-msedge
services:
  msedge:
    image: linuxserver/msedge:153.0.4234@sha256:5968ad8be0387e963d1c81c3b85f434cb8eefb6aef187d4e9cc34f9de08def69
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      EDGE_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: msedge-by-roket
