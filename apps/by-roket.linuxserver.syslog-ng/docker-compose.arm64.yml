name: linuxserver-syslog-ng
services:
  syslog-ng:
    image: linuxserver/syslog-ng:4.11.0@sha256:861ee97a4b51176f41d2a0e4b432f0ff91ef0867bc24d1ab6c817299aa526732
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LOG_TO_STDOUT: ''
    ports:
      - target: 514
        published: 5514
        protocol: udp
      - target: 601
        published: 6601
        protocol: tcp
      - target: 6514
        published: 6514
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /var/log
        target: /var/log
    container_name: syslog-ng-by-roket
x-casaos:
