name: linuxserver-syslog-ng
services:
  syslog-ng:
    image: linuxserver/syslog-ng:4.11.0@sha256:b43b887a0d6eba42c170901b04ec5deae1867b7442b862cfdf1838bbf8185c8f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LOG_TO_STDOUT: ''
    ports:
      - target: 514
        published: 5514
        protocol: udp
      - target: 601
        published: 6601
        protocol: tcp
      - target: 6514
        published: 6514
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /var/log
        target: /var/log
    container_name: syslog-ng-by-roket
x-casaos:
  main: syslog-ng
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.syslog-ng/assets/icon.png
  title:
    en_US: Syslog ng (LinuxServer.io)
  id: by-roket.linuxserver.syslog-ng
  version: 4.11.0
  index: /
  port_map: ''
