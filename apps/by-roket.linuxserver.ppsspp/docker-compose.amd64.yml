name: linuxserver-ppsspp
services:
  ppsspp:
    image: linuxserver/ppsspp:1.20.4@sha256:6a99045d9b1641783f41c55fac47b6bca6faf022591289c39fa4522bad8113e8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: ppsspp-by-roket
x-casaos:
