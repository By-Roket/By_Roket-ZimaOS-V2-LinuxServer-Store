name: linuxserver-melonds
services:
  melonds:
    image: linuxserver/melonds:1.1.20260816
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: melonds-by-roket
x-casaos:
  main: melonds
  icon: https://by-roket.github.io/By_Roket-ZimaOS-V2-LinuxServer-Store/apps/by-roket.linuxserver.melonds/assets/icon.png
  title:
    en_US: Melonds (LinuxServer.io)
  id: by-roket.linuxserver.melonds
  port_map: '3000'
  version: 1.1.20260816
  index: /
